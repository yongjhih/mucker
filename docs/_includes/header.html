<header class="site-header">

      <div class="brand-badge-icon">M</div>
      <span class="brand-name">Mucker</span>
      <span class="brand-tag">v1.0</span>
    </a>

    <nav class="site-nav">
      <a href="{{ '/getting-started' | relative_url }}" class="nav-link {% if page.url contains 'getting-started' %}active{% endif %}">Quickstart</a>
