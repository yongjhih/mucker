---
layout: default
---
<div class="doc-container">
  {% include sidebar.html %}
  
  <article class="doc-article markdown-body">
    <div class="doc-header">
      <div class="doc-breadcrumb">
        <a href="{{ '/' | relative_url }}">Home</a> / <span class="current">{{ page.title }}</span>
      </div>
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}
        <p class="doc-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>

    <div class="doc-content">
      {{ content }}
    </div>
  </article>
</div>
