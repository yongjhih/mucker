<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unit test coverage report with multi-commit trends powered by covpages">
  <meta name="color-scheme" content="light dark">
  <title>Mucker Multi-Platform Test Coverage - covpages</title>
  <style>

/* Primer-inspired GitHub theme design tokens (Restrained & Impeccable compliant) */
:root {
  color-scheme: light dark;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-canvas-overlay: #ffffff;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #59636e;
  --color-fg-subtle: #656d76;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: rgba(9, 105, 218, 0.08);
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: rgba(26, 127, 55, 0.08);
  --color-success-line: rgba(26, 127, 55, 0.06);
  --color-success-gutter: rgba(26, 127, 55, 0.14);
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: rgba(207, 34, 46, 0.08);
  --color-danger-line: rgba(207, 34, 46, 0.07);
  --color-danger-gutter: rgba(207, 34, 46, 0.15);
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #9a6700;
  --color-attention-subtle: rgba(154, 103, 0, 0.08);
  --color-neutral-subtle: rgba(129, 139, 152, 0.1);
  --color-neutral-emphasis: #656d76;
  --color-tab-indicator: #1f2328;

  --color-btn-bg: #f6f8fa;
  --color-btn-border: #d0d7de;
  --color-btn-hover-bg: #eaeef2;
  --color-btn-primary-bg: #1f883d;
  --color-btn-primary-fg: #ffffff;
  --color-btn-primary-border: #1a7f37;
  --color-btn-primary-hover-bg: #1a7f37;

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 0 rgba(31, 35, 40, 0.04);
  --shadow-rest: 0 4px 12px rgba(31, 35, 40, 0.08), 0 1px 2px rgba(31, 35, 40, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-color-mode="light"]) {
    color-scheme: dark;
    --color-canvas-default: #0d1117;
    --color-canvas-subtle: #161b22;
    --color-canvas-inset: #010409;
    --color-canvas-overlay: #161b22;
    --color-border-default: #30363d;
    --color-border-muted: #21262d;
    --color-fg-default: #e6edf3;
    --color-fg-muted: #8b949e;
    --color-fg-subtle: #6e7681;
    --color-accent-fg: #4493f8;
    --color-accent-emphasis: #1f6feb;
    --color-accent-subtle: rgba(56, 139, 253, 0.1);
    --color-success-fg: #3fb950;
    --color-success-emphasis: #238636;
    --color-success-subtle: rgba(46, 160, 67, 0.1);
    --color-success-line: rgba(46, 160, 67, 0.07);
    --color-success-gutter: rgba(46, 160, 67, 0.16);
    --color-danger-fg: #f85149;
    --color-danger-emphasis: #da3633;
    --color-danger-subtle: rgba(248, 81, 73, 0.1);
    --color-danger-line: rgba(248, 81, 73, 0.08);
    --color-danger-gutter: rgba(248, 81, 73, 0.18);
    --color-attention-fg: #d29922;
    --color-attention-emphasis: #9e6a03;
    --color-attention-subtle: rgba(187, 128, 9, 0.1);
    --color-neutral-subtle: rgba(110, 118, 129, 0.12);
    --color-neutral-emphasis: #6e7681;
    --color-tab-indicator: #e6edf3;

    --color-btn-bg: #21262d;
    --color-btn-border: #30363d;
    --color-btn-hover-bg: #30363d;
    --color-btn-primary-bg: #238636;
    --color-btn-primary-fg: #ffffff;
    --color-btn-primary-border: rgba(240, 246, 252, 0.1);
    --color-btn-primary-hover-bg: #1a7f37;

    --chart-grid: #21262d;
    --chart-line: #388bfd;
    --chart-fill: rgba(56, 139, 253, 0.1);
    --shadow-rest: 0 8px 24px rgba(1, 4, 9, 0.45), 0 1px 3px rgba(1, 4, 9, 0.3);
  }
}

:root[data-theme="dark"],
:root[data-color-mode="dark"] {
  color-scheme: dark;
  --color-canvas-default: #0d1117;
  --color-canvas-subtle: #161b22;
  --color-canvas-inset: #010409;
  --color-canvas-overlay: #161b22;
  --color-border-default: #30363d;
  --color-border-muted: #21262d;
  --color-fg-default: #e6edf3;
  --color-fg-muted: #8b949e;
  --color-fg-subtle: #6e7681;
  --color-accent-fg: #4493f8;
  --color-accent-emphasis: #1f6feb;
  --color-accent-subtle: rgba(56, 139, 253, 0.1);
  --color-success-fg: #3fb950;
  --color-success-emphasis: #238636;
  --color-success-subtle: rgba(46, 160, 67, 0.1);
  --color-success-line: rgba(46, 160, 67, 0.07);
  --color-success-gutter: rgba(46, 160, 67, 0.16);
  --color-danger-fg: #f85149;
  --color-danger-emphasis: #da3633;
  --color-danger-subtle: rgba(248, 81, 73, 0.1);
  --color-danger-line: rgba(248, 81, 73, 0.08);
  --color-danger-gutter: rgba(248, 81, 73, 0.18);
  --color-attention-fg: #d29922;
  --color-attention-emphasis: #9e6a03;
  --color-attention-subtle: rgba(187, 128, 9, 0.1);
  --color-neutral-subtle: rgba(110, 118, 129, 0.12);
  --color-neutral-emphasis: #6e7681;
  --color-tab-indicator: #e6edf3;

  --color-btn-bg: #21262d;
  --color-btn-border: #30363d;
  --color-btn-hover-bg: #30363d;
  --color-btn-primary-bg: #238636;
  --color-btn-primary-fg: #ffffff;
  --color-btn-primary-border: rgba(240, 246, 252, 0.1);
  --color-btn-primary-hover-bg: #1a7f37;

  --chart-grid: #21262d;
  --chart-line: #388bfd;
  --chart-fill: rgba(56, 139, 253, 0.1);
  --shadow-rest: 0 8px 24px rgba(1, 4, 9, 0.45), 0 1px 3px rgba(1, 4, 9, 0.3);
}

:root[data-theme="light"],
:root[data-color-mode="light"] {
  color-scheme: light;
  --color-canvas-default: #ffffff;
  --color-canvas-subtle: #f6f8fa;
  --color-canvas-inset: #f6f8fa;
  --color-canvas-overlay: #ffffff;
  --color-border-default: #d0d7de;
  --color-border-muted: #d8dee4;
  --color-fg-default: #1f2328;
  --color-fg-muted: #59636e;
  --color-fg-subtle: #656d76;
  --color-accent-fg: #0969da;
  --color-accent-emphasis: #0969da;
  --color-accent-subtle: rgba(9, 105, 218, 0.08);
  --color-success-fg: #1a7f37;
  --color-success-emphasis: #1f883d;
  --color-success-subtle: rgba(26, 127, 55, 0.08);
  --color-success-line: rgba(26, 127, 55, 0.06);
  --color-success-gutter: rgba(26, 127, 55, 0.14);
  --color-danger-fg: #cf222e;
  --color-danger-emphasis: #cf222e;
  --color-danger-subtle: rgba(207, 34, 46, 0.08);
  --color-danger-line: rgba(207, 34, 46, 0.07);
  --color-danger-gutter: rgba(207, 34, 46, 0.15);
  --color-attention-fg: #9a6700;
  --color-attention-emphasis: #9a6700;
  --color-attention-subtle: rgba(154, 103, 0, 0.08);
  --color-neutral-subtle: rgba(129, 139, 152, 0.1);
  --color-neutral-emphasis: #656d76;
  --color-tab-indicator: #1f2328;

  --color-btn-bg: #f6f8fa;
  --color-btn-border: #d0d7de;
  --color-btn-hover-bg: #eaeef2;
  --color-btn-primary-bg: #1f883d;
  --color-btn-primary-fg: #ffffff;
  --color-btn-primary-border: #1a7f37;
  --color-btn-primary-hover-bg: #1a7f37;

  --chart-grid: #eaeef2;
  --chart-line: #0969da;
  --chart-fill: rgba(9, 105, 218, 0.08);
  --shadow-rest: 0 4px 12px rgba(31, 35, 40, 0.08), 0 1px 2px rgba(31, 35, 40, 0.06);
}

*, *::before, *::after {
  box-sizing: border-box;
}

::selection {
  background-color: var(--color-accent-subtle);
  color: var(--color-fg-default);
}

html {
  scrollbar-color: var(--color-border-default) transparent;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  caret-color: var(--color-fg-default);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  text-underline-offset: 0.2em;
}

/* Header bar */
.gh-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 12px 24px;
}

.gh-header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.gh-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--color-fg-default);
  font-weight: 600;
  font-size: 15px;
}

.gh-brand-icon {
  display: flex;
  align-items: center;
  color: var(--color-fg-default);
}

.gh-repo-title {
  color: var(--color-fg-muted);
  font-weight: 500;
}

.gh-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* GitHub Primer Buttons & Selectors */
.gh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 20px;
  color: var(--color-fg-default);
  background-color: var(--color-btn-bg);
  border: 1px solid var(--color-btn-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  text-decoration: none;
  transition: background-color 120ms cubic-bezier(0.25, 1, 0.5, 1), border-color 120ms cubic-bezier(0.25, 1, 0.5, 1);
  box-shadow: var(--shadow-sm);
  user-select: none;
}

.gh-btn:hover {
  background-color: var(--color-btn-hover-bg);
  border-color: var(--color-btn-border);
}

.gh-btn:active {
  background-color: var(--color-neutral-subtle);
}

.gh-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
  outline-offset: 1px;
}

.gh-btn-primary {
  color: var(--color-btn-primary-fg) !important;
  background-color: var(--color-btn-primary-bg);
  border-color: var(--color-btn-primary-border);
  font-weight: 500;
}

.gh-btn-primary:hover {
  background-color: var(--color-btn-primary-hover-bg);
  border-color: var(--color-btn-primary-border);
  opacity: 1;
}

/* Ref (Branch/Tag) Selector Popover */
.ref-selector-wrap {
  position: relative;
}

.ref-selector-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.ref-btn-label {
  font-weight: 600;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dropdown-caret {
  font-size: 10px;
  margin-left: 2px;
  color: var(--color-fg-muted);
}

.ref-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 300px;
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-rest);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ref-popover-header {
  padding: 8px 10px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
}

.ref-popover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.ref-popover-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.ref-popover-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 13px;
  color: var(--color-fg-muted);
  border-radius: var(--radius-sm);
}

.ref-popover-close:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.ref-search-wrap {
  margin-bottom: 8px;
}

.ref-search-input {
  width: 100%;
  padding: 5px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm);
  outline: none;
}

.ref-search-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.ref-search-input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.ref-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--color-border-muted);
  margin-top: 4px;
}

.ref-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-muted);
  cursor: pointer;
  margin-bottom: -1px;
}

.ref-tab:hover {
  color: var(--color-fg-default);
}

.ref-tab.active {
  color: var(--color-fg-default);
  border-bottom-color: var(--color-tab-indicator);
  font-weight: 600;
}

.ref-list {
  max-height: 250px;
  overflow-y: auto;
  padding: 4px 0;
}

.ref-item {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--color-fg-default);
  cursor: pointer;
  gap: 8px;
  text-decoration: none;
}

.ref-item:hover, .ref-item.active {
  background-color: var(--color-canvas-subtle);
}

.ref-item.selected {
  font-weight: 600;
}

.ref-item-check {
  width: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-fg-default);
  flex-shrink: 0;
}

.ref-item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ref-item-badge {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  margin-left: auto;
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

.ref-empty {
  padding: 16px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

/* Tabs */
.gh-nav-tabs {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 0 24px;
}

.gh-nav-tabs-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.gh-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-fg-muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.gh-tab:hover {
  color: var(--color-fg-default);
}

.gh-tab.active {
  color: var(--color-fg-default);
  font-weight: 600;
  border-bottom-color: var(--color-tab-indicator);
}

.gh-tab .counter {
  display: inline-block;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 18px;
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
  border-radius: 20px;
}

/* Main Container */
.gh-container {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  flex: 1;
}

/* Compact Summary Strip (replaces oversized hero metric cards) */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  background-color: var(--color-canvas-default);
  margin-bottom: 20px;
  overflow: hidden;
}

.metric-card {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid var(--color-border-muted);
}

.metric-card:last-child {
  border-right: none;
}

.metric-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.metric-value-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}

.metric-percent {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  color: var(--color-fg-default);
}

.metric-counts {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--color-fg-muted);
}

/* Progress bar */
.progress-bar-container {
  height: 4px;
  background-color: var(--color-border-muted);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 2px;
}

/* Delta badges */
.delta-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  border-radius: var(--radius-sm);
  line-height: 16px;
  border: 1px solid transparent;
}

.delta-badge.positive {
  color: var(--color-success-fg);
  background-color: var(--color-success-subtle);
}

.delta-badge.negative {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

.delta-badge.neutral {
  color: var(--color-fg-muted);
  background-color: var(--color-neutral-subtle);
}

/* GitHub Commit Banner */
.commit-banner {
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.commit-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.commit-author-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background-color: var(--color-neutral-subtle);
  border: 1px solid var(--color-border-default);
  color: var(--color-fg-default);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

.commit-message {
  font-weight: 500;
  color: var(--color-fg-default);
}

.commit-meta {
  color: var(--color-fg-muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.commit-sha-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  background-color: var(--color-neutral-subtle);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-muted);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Toolbar & Breadcrumbs */
.file-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--color-fg-muted);
  flex-wrap: wrap;
}

.breadcrumb-item {
  color: var(--color-accent-fg);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}

.breadcrumb-item:hover {
  text-decoration: underline;
}

.breadcrumb-separator {
  color: var(--color-fg-muted);
}

.search-box {
  position: relative;
  min-width: 220px;
}

.search-box input {
  width: 100%;
  padding: 5px 10px 5px 30px;
  font-size: 13px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.search-box input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.search-box input:focus {
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 3px var(--color-accent-subtle);
}

.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  pointer-events: none;
  z-index: 1;
}

/* File Table */
.gh-box {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.table-wrapper {
  overflow-x: auto;
  max-inline-size: 100%;
}

table.gh-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

table.gh-table th {
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-muted);
  font-weight: 600;
  padding: 8px 16px;
  border-bottom: 1px solid var(--color-border-default);
  white-space: nowrap;
  user-select: none;
}

table.gh-table th.sortable {
  cursor: pointer;
}

table.gh-table th.sortable:hover {
  color: var(--color-fg-default);
}

table.gh-table td {
  padding: 8px 16px;
  border-top: 1px solid var(--color-border-muted);
  color: var(--color-fg-default);
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
}

table.gh-table tbody tr:first-child td {
  border-top: none;
}

table.gh-table tbody tr:hover td {
  background-color: var(--color-canvas-subtle);
}

.file-name-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}

.file-name-cell svg {
  color: var(--color-fg-muted);
}

.file-link {
  color: var(--color-fg-default);
  text-decoration: none;
  cursor: pointer;
}

.file-link:hover {
  color: var(--color-accent-fg);
  text-decoration: underline;
}

/* Rate Pill (Primer + shadcn/ui subtle badge) */
.rate-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  border: 1px solid transparent;
}

.rate-high {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
  border-color: var(--color-border-muted);
}

.rate-medium {
  color: var(--color-attention-fg);
  background-color: var(--color-attention-subtle);
}

.rate-low {
  color: var(--color-danger-fg);
  background-color: var(--color-danger-subtle);
}

/* Charts */
.chart-container {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 24px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}

.chart-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-fg-default);
}

.chart-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.svg-chart {
  width: 100%;
  height: 220px;
  overflow: visible;
}

.chart-dot {
  cursor: pointer;
  transition: r 0.15s cubic-bezier(0.25, 1, 0.5, 1), fill 0.15s cubic-bezier(0.25, 1, 0.5, 1);
}

.chart-dot:hover {
  r: 5;
  fill: var(--color-fg-default);
}

/* Tooltip */
.chart-tooltip {
  position: absolute;
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  box-shadow: var(--shadow-rest);
  font-size: 12px;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.15s cubic-bezier(0.25, 1, 0.5, 1);
  white-space: nowrap;
}

/* Code Viewer */
.blob-wrapper {
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 24px;
}

.blob-header {
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--color-fg-muted);
}

.blob-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.code-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.code-table td {
  padding: 0 8px;
}

.code-table tr:hover td {
  background-color: var(--color-neutral-subtle);
}

.blob-num {
  width: 1%;
  min-width: 48px;
  text-align: right;
  color: var(--color-fg-subtle);
  font-variant-numeric: tabular-nums;
  user-select: none;
  cursor: pointer;
  border-right: 1px solid var(--color-border-muted);
}

.blob-hits {
  width: 1%;
  min-width: 36px;
  text-align: right;
  color: var(--color-fg-muted);
  font-variant-numeric: tabular-nums;
  user-select: none;
  font-size: 11px;
  border-right: 1px solid var(--color-border-muted);
}

.blob-code {
  white-space: pre-wrap;
  word-break: break-all;
  padding-left: 12px !important;
}

/* Line Coverage Highlighting (Softened GitHub Primer diff style) */
tr.line-covered {
  background-color: var(--color-success-line);
}

tr.line-covered .blob-num,
tr.line-covered .blob-hits {
  background-color: var(--color-success-gutter);
}

tr.line-covered .blob-hits {
  color: var(--color-success-fg);
  font-weight: 500;
}

tr.line-uncovered {
  background-color: var(--color-danger-line);
}

tr.line-uncovered .blob-num,
tr.line-uncovered .blob-hits {
  background-color: var(--color-danger-gutter);
}

tr.line-uncovered .blob-hits {
  color: var(--color-danger-fg);
  font-weight: 600;
}

/* GitHub Primer Syntax Highlighting Tokens (Light) */
.token.comment, .token.prolog, .token.doctype, .token.cdata { color: #59636e; font-style: italic; }
.token.punctuation { color: #1f2328; }
.token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #0550ae; }
.token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #0a3069; }
.token.operator, .token.entity, .token.url { color: #0550ae; }
.token.atrule, .token.attr-value, .token.keyword { color: #cf222e; font-weight: 500; }
.token.function, .token.class-name { color: #6639ba; }
.token.regex, .token.important, .token.variable { color: #953800; }

/* GitHub Primer Syntax Highlighting Tokens (Dark Mode) */
[data-theme="dark"] .token.comment,
[data-theme="dark"] .token.prolog,

[data-color-mode="dark"] .token.comment,

[data-color-mode="dark"] .token.boolean,
[data-color-mode="dark"] .token.number,
[data-color-mode="dark"] .token.constant,
[data-color-mode="dark"] .token.symbol { color: #79c0ff; }

[data-theme="dark"] .token.attr-name,
[data-theme="dark"] .token.string,
[data-theme="dark"] .token.char,
[data-theme="dark"] .token.builtin,
[data-color-mode="dark"] .token.selector,
[data-color-mode="dark"] .token.attr-name,
[data-color-mode="dark"] .token.string,
[data-color-mode="dark"] .token.char,
[data-color-mode="dark"] .token.builtin { color: #a5d6ff; }
[data-theme="dark"] .token.operator,
[data-theme="dark"] .token.entity,
[data-theme="dark"] .token.url,
[data-color-mode="dark"] .token.operator,
[data-color-mode="dark"] .token.entity,
[data-color-mode="dark"] .token.url { color: #79c0ff; }
[data-theme="dark"] .token.atrule,
[data-theme="dark"] .token.attr-value,
[data-theme="dark"] .token.keyword,
[data-color-mode="dark"] .token.atrule,
[data-color-mode="dark"] .token.attr-value,
[data-color-mode="dark"] .token.keyword { color: #ff7b72; font-weight: 500; }
[data-theme="dark"] .token.function,
[data-theme="dark"] .token.class-name,

[data-color-mode="dark"] .token.class-name { color: #d2a8ff; }

[data-theme="dark"] .token.variable,
[data-color-mode="dark"] .token.regex,

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.comment,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.prolog,

  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.property,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.tag,

  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.selector,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.attr-name,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.string,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.char,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.builtin { color: #a5d6ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.operator,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.entity,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.url { color: #79c0ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.atrule,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.attr-value,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.keyword { color: #ff7b72; font-weight: 500; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.function,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.class-name { color: #d2a8ff; }
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.regex,
  :root:not([data-theme="light"]):not([data-color-mode="light"]) .token.important,

}


/* File Tree Sidebar & Layout */
.files-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  width: 100%;
}

.files-sidebar {
  width: 280px;
  flex-shrink: 0;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.files-layout.sidebar-collapsed .files-sidebar {
  display: none;
}

.files-main {
  flex: 1;
  min-width: 0;
}

.sidebar-header {
  padding: 8px 12px;
  background-color: var(--color-canvas-subtle);
  border-bottom: 1px solid var(--color-border-default);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-fg-default);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-counter {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  background-color: var(--color-neutral-subtle);
  border-radius: 10px;
  color: var(--color-fg-muted);
}

.sidebar-btn-icon {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-btn-icon:hover {
  color: var(--color-fg-default);
  background-color: var(--color-neutral-subtle);
}

.sidebar-btn-icon:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.goto-box {
  padding: 8px 10px;
  border-bottom: 1px solid var(--color-border-muted);
  background-color: var(--color-canvas-default);
  position: relative;
}

.goto-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.goto-input {
  width: 100%;
  padding: 5px 28px 5px 28px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  outline: none;
}

.goto-input::placeholder {
  color: var(--color-fg-muted);
  opacity: 1;
}

.goto-input:focus {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
  box-shadow: 0 0 0 2px var(--color-accent-subtle);
}

.goto-icon {
  position: absolute;
  left: 8px;
  color: var(--color-fg-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
  z-index: 1;
}

.goto-shortcut {
  position: absolute;
  right: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 4px;
  background-color: var(--color-canvas-default);
  border: 1px solid var(--color-border-default);
  border-radius: 3px;
  color: var(--color-fg-muted);
  pointer-events: none;
  line-height: 14px;
}

.goto-clear {
  position: absolute;
  right: 6px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  color: var(--color-fg-muted);
  display: flex;
  align-items: center;
}

.goto-clear:hover {
  color: var(--color-fg-default);
}

.tree-container {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 4px;
  flex: 1;
}

.tree-node {
  position: relative;
  display: flex;
  align-items: center;
  padding: 4px 8px;
  font-size: 12px;
  line-height: 20px;
  border-radius: var(--radius-sm);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  gap: 6px;
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.tree-node:hover {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
}

.tree-node.selected {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.tree-node.selected::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 2px;
  background-color: var(--color-tab-indicator);
  border-radius: 1px;
}

.tree-node:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.tree-node[data-tree-folder] .tree-icon {
  color: var(--color-fg-muted);
}

.tree-node[data-tree-file] .tree-icon {
  color: var(--color-fg-subtle);
}

.tree-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--color-fg-muted);
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

.tree-toggle-spacer {
  width: 16px;
  flex-shrink: 0;
}

.tree-icon {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.tree-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree-badge {
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 0 4px;
  border-radius: var(--radius-sm);
  margin-left: 4px;
  flex-shrink: 0;
  line-height: 16px;
  color: var(--color-fg-muted);
}

.tree-badge-high {
  color: var(--color-fg-muted);
}

.tree-badge-med {
  color: var(--color-attention-fg);
}

.tree-badge-low {
  color: var(--color-danger-fg);
}

.goto-results {
  overflow-y: auto;
  padding: 6px 4px;
  flex: 1;
}

.goto-item {
  position: relative;
  display: flex;
  align-items: center;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 8px;
  color: var(--color-fg-default);
  margin: 1px 0;
  transition: background-color 0.1s ease;
}

.goto-item:hover, .goto-item.active {
  background-color: var(--color-neutral-subtle);
}

.goto-item.selected {
  background-color: var(--color-neutral-subtle);
  color: var(--color-fg-default);
  font-weight: 600;
}

.goto-item.selected::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background-color: var(--color-tab-indicator);
  border-radius: 1px;
}

.goto-item-path {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
}

.goto-highlight {
  font-weight: 700;
  color: var(--color-accent-fg);
}

.goto-empty {
  padding: 24px 12px;
  text-align: center;
  color: var(--color-fg-muted);
  font-size: 12px;
}

.sidebar-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
}

.sidebar-toggle-btn:hover {
  background-color: var(--color-canvas-default);
  border-color: var(--color-accent-fg);
}

.sidebar-toggle-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

/* Footer */
.gh-footer {
  border-top: 1px solid var(--color-border-default);
  padding: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--color-fg-muted);
  margin-top: auto;
}

.gh-footer a {
  color: var(--color-accent-fg);
  text-decoration: none;
}

.gh-footer a:hover {
  text-decoration: underline;
}

/* Badge Copy & Modal */
.badge-toolbar-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  font-size: 12px;
  line-height: 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-default);
  background-color: var(--color-canvas-subtle);
  color: var(--color-fg-default);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s ease;
}

.badge-btn:hover {
  background-color: var(--color-neutral-subtle);
  border-color: var(--color-border-muted);
}

.badge-btn:focus-visible {
  outline: 2px solid var(--color-accent-fg);
}

.badge-svg-display {
  display: inline-flex;
  align-items: center;
  line-height: 0;
}

.badge-svg-display svg {
  display: block;
  height: 20px;
  width: auto;
  max-width: none;
  border-radius: 3px;
}

.badge-copy-text {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
  font-size: 12px;
}

/* Primer Toast Notification */
.gh-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 99999;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--color-fg-default);
  background-color: var(--color-canvas-overlay);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);

.badge-modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.4);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.badge-modal {

  overflow: hidden;

@keyframes modalFadeIn {

.badge-modal-header {

  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border-default);
}

.badge-modal-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-fg-default);
}

.badge-modal-close {

  border: none;
  color: var(--color-fg-muted);

  padding: 4px;
  font-size: 16px;
  display: flex;
  align-items: center;
  border-radius: var(--radius-sm);
}

.badge-modal-close:hover {
  color: var(--color-fg-default);

}

.badge-modal-body {

  flex-direction: column;
  gap: 16px;
}

.badge-preview-box {

  justify-content: center;

}

.badge-field-label {

  font-weight: 600;

  justify-content: space-between;

}

.badge-code-wrap {

}

.badge-code-input {

  color: var(--color-fg-default);

ts":0},"134":{"hits":0},"135":{"hits":0},"136":{"hits":0},"137":{"hits":0},"138":{"hits":0},"139":{"hits":0},"140":{"hits":0},"141":{"hits":0},"142":{"hits":0},"143":{"hits":0},"144":{"hits":0},"145":{"hits":0},"148":{"hits":0},"150":{"hits":0},"152":{"hits":0},"153":{"hits":0},"154":{"hits":0},"155":{"hits":0},"159":{"hits":0},"160":{"hits":0},"161":{"hits":0},"162":{"hits":0},"165":{"hits":0},"170":{"hits":0},"171":{"hits":0}},"sourceCode":"package io.github.mucker.server\n\nimport android.content.Context\nimport io.github.mucker.core.MockEngine\nimport io.github.mucker.core.models.MockDecision\nimport io.github.mucker.core.models.MockRule\nimport io.github.mucker.util.NetworkUtils\nimport org.json.JSONArray\nimport org.json.JSONObject\n\n/**\n * Handles HTTP REST endpoints for Mucker Dashboard, CLI, and CDP Discovery.\n */\nclass RestHandler(\n    private val engine: MockEngine,\n    private val port: Int,\n    private val context: Context?\n) {\n    data class HttpResponse(\n        val statusCode: Int = 200,\n        val contentType: String = \"application/json; charset=utf-8\",\n        val body: String = \"\"\n    )\n\n    fun handle(method: String, path: String, body: String): HttpResponse {\n        val cleanPath = path.split(\"?\")[0].trimEnd('/')\n\n        return when {\n            // CDP Discovery Endpoints\n            method == \"GET\" && cleanPath == \"/json/version\" -\u003e {\n                val json = JSONObject()\n                json.put(\"Browser\", \"Mucker/1.0.0\")\n                json.put(\"Protocol-Version\", \"1.3\")\n                json.put(\"User-Agent\", \"Mucker In-App DevTools\")\n                json.put(\"V8-Version\", \"1.0.0\")\n                json.put(\"webSocketDebuggerUrl\", \"ws://${getWsHost()}/devtools/page\")\n                HttpResponse(200, \"application/json\", json.toString())\n            }\n\n            method == \"GET\" && (cleanPath == \"/json/list\" || cleanPath == \"/json\") -\u003e {\n                val array = JSONArray()\n                val target = JSONObject()\n                target.put(\"id\", \"mucker-inapp-target\")\n                target.put(\"type\", \"page\")\n                target.put(\"title\", \"Mucker DevTools (${context?.packageName ?: \"Android App\"})\")\n                target.put(\"description\", \"Mucker In-App OkHttp Mock Engine\")\n                target.put(\"devtoolsFrontendUrl\", \"devtools/inspector.html?ws=${getWsHost()}/devtools/page\")\n                target.put(\"webSocketDebuggerUrl\", \"ws://${getWsHost()}/devtools/page\")\n                target.put(\"url\", \"http://${getWsHost()}/\")\n                array.put(target)\n                HttpResponse(200, \"application/json\", array.toString())\n            }\n\n            // Status Endpoints\n            method == \"GET\" && cleanPath == \"/api/status\" -\u003e {\n                val json = JSONObject()\n                json.put(\"status\", \"running\")\n                json.put(\"version\", \"1.0.0\")\n                json.put(\"port\", port)\n                json.put(\"app\", context?.packageName ?: \"Android App\")\n                json.put(\"breakpointMode\", engine.breakpointMode)\n                json.put(\"activeRulesCount\", engine.rules.getAllRules().size)\n                json.put(\"pausedRequestsCount\", engine.getPendingPausedCount())\n                val mcp = JSONObject()\n                mcp.put(\"http\", \"/mcp\")\n                mcp.put(\"sse\", \"/sse\")\n                json.put(\"mcp\", mcp)\n                HttpResponse(200, \"application/json\", json.toString())\n            }\n\n            method == \"POST\" && cleanPath == \"/api/status\" -\u003e {\n                try {\n                    val req = JSONObject(body)\n                    if (req.has(\"breakpointMode\")) {\n                        engine.breakpointMode = req.getBoolean(\"breakpointMode\")\n                    }\n                    HttpResponse(200, \"application/json\", JSONObject().put(\"success\", true).toString())\n                } catch (e: Exception) {\n                    HttpResponse(400, \"application/json\", JSONObject().put(\"error\", e.message).toString())\n                }\n            }\n\n            // Rules Endpoints\n            method == \"GET\" && cleanPath == \"/api/rules\" -\u003e {\n                HttpResponse(200, \"application/json\", engine.rules.toJson().toString())\n            }\n\n            method == \"POST\" && cleanPath == \"/api/rules\" -\u003e {\n                try {\n                    val reqJson = JSONObject(body)\n                    val rule = MockRule.fromJson(reqJson)\n                    engine.rules.addRule(rule)\n                    HttpResponse(200, \"application/json\", rule.toJson().toString())\n                } catch (e: Exception) {\n                    HttpResponse(400, \"application/json\", JSONObject().put(\"error\", e.message).toString())\n                }\n            }\n\n            method == \"DELETE\" && cleanPath == \"/api/rules\" -\u003e {\n                engine.rules.clearRules()\n                HttpResponse(200, \"application/json\", JSONObject().put(\"success\", true).toString())\n            }\n\n            method == \"DELETE\" && cleanPath.startsWith(\"/api/rules/\") -\u003e {\n                val id = cleanPath.removePrefix(\"/api/rules/\")\n                val removed = engine.rules.removeRule(id)\n                HttpResponse(200, \"application/json\", JSONObject().put(\"success\", removed).toString())\n            }\n\n            method == \"POST\" && cleanPath == \"/api/rules/toggle\" -\u003e {\n                try {\n                    val req = JSONObject(body)\n                    val id = req.getString(\"id\")\n                    val isEnabled = req.getBoolean(\"isEnabled\")\n                    val ok = engine.rules.toggleRule(id, isEnabled)\n                    HttpResponse(200, \"application/json\", JSONObject().put(\"success\", ok).toString())\n                } catch (e: Exception) {\n                    HttpResponse(400, \"application/json\", JSONObject().put(\"error\", e.message).toString())\n                }\n            }\n\n            // History Endpoints\n            method == \"GET\" && cleanPath == \"/api/history\" -\u003e {\n                HttpResponse(200, \"application/json\", engine.history.toJson().toString())\n            }\n\n            method == \"DELETE\" && cleanPath == \"/api/history\" -\u003e {\n                engine.history.clear()\n                HttpResponse(200, \"application/json\", JSONObject().put(\"success\", true).toString())\n            }\n\n            // Paused Request Endpoints\n            method == \"POST\" && cleanPath.startsWith(\"/api/paused/\") && cleanPath.endsWith(\"/fulfill\") -\u003e {\n                val reqId = cleanPath.removePrefix(\"/api/paused/\").removeSuffix(\"/fulfill\")\n                try {\n                    val req = JSONObject(body)\n                    val statusCode = req.optInt(\"statusCode\", 200)\n                    val resBody = req.optString(\"responseBody\", \"\")\n                    val headersMap = mutableMapOf\u003cString, String\u003e()\n                    if (req.has(\"responseHeaders\")) {\n                        val h = req.getJSONObject(\"responseHeaders\")\n                        val keys = h.keys()\n                        while (keys.hasNext()) {\n                            val k = keys.next()\n                            headersMap[k] = h.getString(k)\n                        }\n                    } else {\n                        headersMap[\"Content-Type\"] = \"application/json\"\n                    }\n                    headersMap[\"X-Mocked-By\"] = \"Dashboard\"\n\n                    val ok = engine.fulfill(reqId, MockDecision.Fulfill(statusCode, headersMap, resBody))\n                    HttpResponse(200, \"application/json\", JSONObject().put(\"success\", ok).toString())\n                } catch (e: Exception) {\n                    HttpResponse(400, \"application/json\", JSONObject().put(\"error\", e.message).toString())\n                }\n            }\n\n            method == \"POST\" && cleanPath.startsWith(\"/api/paused/\") && cleanPath.endsWith(\"/continue\") -\u003e {\n                val reqId = cleanPath.removePrefix(\"/api/paused/\").removeSuffix(\"/continue\")\n                val ok = engine.continueRequest(reqId)\n                HttpResponse(200, \"application/json\", JSONObject().put(\"success\", ok).toString())\n            }\n\n            else -\u003e HttpResponse(404, \"application/json\", JSONObject().put(\"error\", \"Not Found\").toString())\n        }\n    }\n\n    private fun getWsHost(): String {\n        val ip = NetworkUtils.getLocalIpAddress(context)\n        return \"$ip:$port\"\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/mucker/server/WebSocketConnection.kt":{"path":"mucker-interceptor/src/main/java/io/github/mucker/server/WebSocketConnection.kt","lines":{"total":79,"covered":0,"skipped":79,"pct":0},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"11":{"hits":0},"12":{"hits":0},"13":{"hits":0},"14":{"hits":0},"16":{"hits":0},"17":{"hits":0},"18":{"hits":0},"22":{"hits":0},"23":{"hits":0},"24":{"hits":0},"25":{"hits":0},"26":{"hits":0},"28":{"hits":0},"30":{"hits":0},"32":{"hits":0},"33":{"hits":0},"37":{"hits":0},"38":{"hits":0},"39":{"hits":0},"40":{"hits":0},"42":{"hits":0},"44":{"hits":0},"45":{"hits":0},"46":{"hits":0},"47":{"hits":0},"48":{"hits":0},"49":{"hits":0},"51":{"hits":0},"52":{"hits":0},"53":{"hits":0},"57":{"hits":0},"58":{"hits":0},"59":{"hits":0},"60":{"hits":0},"62":{"hits":0},"65":{"hits":0},"66":{"hits":0},"68":{"hits":0},"69":{"hits":0},"70":{"hits":0},"73":{"hits":0},"74":{"hits":0},"76":{"hits":0},"77":{"hits":0},"79":{"hits":0},"80":{"hits":0},"81":{"hits":0},"82":{"hits":0},"83":{"hits":0},"84":{"hits":0},"85":{"hits":0},"86 0xFF)\n                outStream.write(len and 0xFF)\n            } else {\n                outStream.write(127)\n                for (i in 7 downTo 0) {\n                    outStream.write(((len.toLong() shr (8 * i)) and 0xFF).toInt())\n                }\n            }\n\n            outStream.write(payload)\n            outStream.flush()\n        } catch (_: Exception) {\n            close()\n        }\n    }\n\n    private fun readFrame(): String? {\n        val b0 = inStream.read()\n        if (b0 == -1) return null\n\n        val opcode = b0 and 0x0F\n        if (opcode == 0x08) { // Close frame\n            return null\n        }\n\n        val b1 = inStream.read()\n        if (b1 == -1) return null\n\n        val isMasked = (b1 and 0x80) != 0\n        var payloadLen = (b1 and 0x7F).toLong()\n\n        if (payloadLen == 126L) {\n            val byte1 = inStream.read()\n            val byte2 = inStream.read()\n            if (byte1 == -1 || byte2 == -1) return null\n            payloadLen = ((byte1 shl 8) or byte2).toLong()\n        } else if (payloadLen == 127L) {\n            payloadLen = 0\n            for (i in 0 until 8) {\n                val b = inStream.read()\n                if (b == -1) return null\n                payloadLen = (payloadLen shl 8) or b.toLong()\n            }\n        }\n\n        val maskingKey = ByteArray(4)\n        if (isMasked) {\n            var read = 0\n            while (read \u003c 4) {\n                val r = inStream.read(maskingKey, read, 4 - read)\n                if (r == -1) return null\n                read += r\n            }\n        }\n\n        val payload = ByteArray(payloadLen.toInt())\n        var totalRead = 0\n        while (totalRead \u003c payload.size) {\n            val r = inStream.read(payload, totalRead, payload.size - totalRead)\n            if (r == -1) return null\n            totalRead += r\n        }\n\n        if (isMasked) {\n            for (i in payload.indices) {\n                payload[i] = (payload[i].toInt() xor maskingKey[i % 4].toInt()).toByte()\n            }\n        }\n\n        return String(payload, StandardCharsets.UTF_8)\n    }\n\n    fun close() {\n        if (isClosed) return\n        isClosed = true\n        try {\n            socket.close()\n        } catch (_: Exception) {}\n        onClose(this)\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/mucker/server/CdpHandler.kt":{"path":"mucker-interceptor/src/main/java/io/github/mucker/server/CdpHandler.kt","lines":{"total":47,"covered":0,"skipped":47,"pct":0},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"12":{"hits":0},"15":{"hits":0},"16":{"hits":0},"17":{"hits":0},"18":{"hits":0},"19":{"hits":0},"21":{"hits":0},"23":{"hits":0},"24":{"hits":0},"25":{"hits":0},"26":{"hits":0},"27":{"hits":0},"28":{"hits":0},"31":{"hits":0},"32":{"hits":0},"34":{"hits":0},"35":{"hits":0},"39":{"hits":0},"40":{"hits":0},"44":{"hits":0},"45":{"hits":0},"46":{"hits":0},"47":{"hits":0},"49":{"hits":0},"50":{"hits":0},"52":{"hits":0},"55":{"hits":0},"56":{"hits":0},"57":{"hits":0},"58":{"hits":0},"59":{"hits":0},"60":{"hits":0},"63":{"hits":0},"65":{"hits":0},"67":{"hits":0},"68":{"hits":0},"72":{"hits":0},"73":{"hits":0},"74":{"hits":0},"78":{"hits":0},"79":{"hits":0},"80":{"hits":0},"81":{"hits":0},"86":{"hits":0},"91":{"hits":0},"94":{"hits":0},"97":{"hits":0}},"sourceCode":"package io.github.mucker.server\n\nimport io.github.mucker.core.MockEngine\nimport io.github.mucker.core.models.CdpMessages\nimport io.github.mucker.core.models.MockDecision\nimport io.github.mucker.util.NetworkUtils\nimport org.json.JSONObject\n\n/**\n * Handles incoming JSON-RPC 2.0 messages according to the Chrome DevTools Protocol Fetch & Network domains.\n */\nclass CdpHandler(private val engine: MockEngine) {\n\n    fun handleMessage(rawMessage: String, connection: WebSocketConnection) {\n        try {\n            val json = JSONObject(rawMessage)\n            val id = json.optLong(\"id\", -1L)\n            val method = json.optString(\"method\", \"\")\n            val params = json.optJSONObject(\"params\") ?: JSONObject()\n\n            when (method) {\n                \"Fetch.enable\" -\u003e {\n                    val patternsList = mutableListOf\u003cString\u003e()\n                    if (params.has(\"patterns\")) {\n                        val patternsArray = params.getJSONArray(\"patterns\")\n                        for (i in 0 until patternsArray.length()) {\n                            val p = patternsArray.getJSONObject(i)\n                            patternsList.add(p.optString(\"urlPattern\", \"*\"))\n                        }\n                    }\n                    if (patternsList.isEmpty()) {\n                        patternsList.add(\"*\")\n                    }\n                    engine.enableInterception(patternsList)\n                    if (id != -1L) connection.sendText(CdpMessages.createRpcSuccess(id))\n                }\n\n                \"Fetch.disable\" -\u003e {\n                    engine.disableInterception()\n                    if (id != -1L) connection.sendText(CdpMessages.createRpcSuccess(id))\n                }\n\n                \"Fetch.fulfillRequest\" -\u003e {\n                    val requestId = params.getString(\"requestId\")\n                    val code = params.optInt(\"responseCode\", 200)\n                    val rawBody = params.optString(\"body\", \"\")\n                    val isBase64 = params.optBoolean(\"bodyIsBase64\", true)\n\n                    val body = if (isBase64 && rawBody.isNotEmpty()) {\n                        NetworkUtils.decodeBase64(rawBody)\n                    } else {\n                        rawBody\n                    }\n\n                    val headersMap = mutableMapOf\u003cString, String\u003e()\n                    if (params.has(\"responseHeaders\")) {\n                        val hArray = params.getJSONArray(\"responseHeaders\")\n                        for (i in 0 until hArray.length()) {\n                            val hObj = hArray.getJSONObject(i)\n                            headersMap[hObj.getString(\"name\")] = hObj.getString(\"value\")\n                        }\n                    } else {\n                        headersMap[\"Content-Type\"] = \"application/json\"\n                    }\n                    headersMap[\"X-Mocked-By\"] = \"CDP-Fetch\"\n\n                    engine.fulfill(requestId, MockDecision.Fulfill(code, headersMap, body))\n                    if (id != -1L) connection.sendText(CdpMessages.createRpcSuccess(id))\n                }\n\n                \"Fetch.continueRequest\" -\u003e {\n                    val requestId = params.getString(\"requestId\")\n                    engine.continueRequest(requestId)\n                    if (id != -1L) connection.sendText(CdpMessages.createRpcSuccess(id))\n                }\n\n                \"Fetch.failRequest\" -\u003e {\n                    val requestId = params.getString(\"requestId\")\n                    val reason = params.optString(\"errorReason\", \"Failed\")\n                    engine.failRequest(requestId, reason)\n                    if (id != -1L) connection.sendText(CdpMessages.createRpcSuccess(id))\n                }\n\n                // Chrome DevTools / Puppeteer handshake compatibility stubs\n                \"Network.enable\", \"Page.enable\", \"Runtime.enable\", \"Log.enable\", \"DOM.enable\" -\u003e {\n                    if (id != -1L) connection.sendText(CdpMessages.createRpcSuccess(id))\n                }\n\n                else -\u003e {\n                    // Unknown method fallback to success for CDP compatibility\n                    if (id != -1L) connection.sendText(CdpMessages.createRpcSuccess(id))\n                }\n            }\n        } catch (e: Exception) {\n            // Malformed message\n        }\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/ 0},"198":{"hits":0},"199":{"hits":0},"202":{"hits":0},"204":{"hits":0},"205":{"hits":0},"207":{"hits":0},"208":{"hits":0},"210":{"hits":0},"211":{"hits":0},"213":{"hits":0},"214":{"hits":0},"217":{"hits":0},"218":{"hits":0},"219":{"hits":0},"222":{"hits":0},"223":{"hits":0},"224":{"hits":0},"225":{"hits":0},"229":{"hits":0},"230":{"hits":0},"231":{"hits":0},"232":{"hits":0},"233":{"hits":0},"234":{"hits":0},"235":{"hits":0},"236":{"hits":0},"239":{"hits":0},"240":{"hits":0},"243":{"hits":0},"244":{"hits":0},"245":{"hits":0},"247":{"hits":0},"250":{"hits":0},"251":{"hits":0},"254":{"hits":0},"255":{"hits":0},"258":{"hits":0},"259":{"hits":0},"260":{"hits":0},"261":{"hits":0},"262":{"hits":0},"263":{"hits":0},"264":{"hits":0},"265":{"hits":0},"266":{"hits":0},"268":{"hits":0},"269":{"hits":0},"270":{"hits":0},"276":{"hits":0},"277":{"hits":0},"278":{"hits":0},"279":{"hits":0},"282":{"hits":0},"289":{"hits":0},"290":{"hits":0},"291":{"hits":0},"292":{"hits":0}},"sourceCode":"package io.github.mucker.server\n\nimport android.content.Context\nimport io.github.mucker.core.MockEngine\nimport java.io.BufferedReader\nimport java.io.InputStreamReader\nimport java.io.OutputStream\nimport java.net.ServerSocket\nimport java.net.Socket\nimport java.nio.charset.StandardCharsets\nimport java.security.MessageDigest\nimport java.util.concurrent.CopyOnWriteArrayList\nimport java.util.concurrent.ExecutorService\nimport java.util.concurrent.Executors\n\n/**\n * Route plugin interface allowing optional modules (e.g. :mucker-mcp) to handle custom HTTP endpoints.\n */\nfun interface HttpRoutePlugin {\n    fun handle(\n        method: String,\n        uri: String,\n        cleanPath: String,\n        headers: Map\u003cString, String\u003e,\n        body: String,\n        socket: Socket,\n        outStream: OutputStream\n    ): Boolean\n}\n\n/**\n * Extended plugin interface with lifecycle notifications.\n */\ninterface MuckerServerPlugin : HttpRoutePlugin {\n    fun onServerStop() {}\n}\n\n/**\n * Lightweight, zero-dependency HTTP & WebSocket server running inside the Android application.\n */\nclass MuckerHttpServer(\n    val port: Int = 8080,\n    private val engine: MockEngine,\n    private val context: Context?\n) {\n    private var serverSocket: ServerSocket? = null\n    @Volatile private var isRunning = false\n    private val executor: ExecutorService = Executors.newCachedThreadPool()\n    private val activeWebSockets = CopyOnWriteArrayList\u003cWebSocketConnection\u003e()\n    private val cdpHandler = CdpHandler(engine)\n    private val restHandler = RestHandler(engine, port, context)\n    val plugins = CopyOnWriteArrayList\u003cHttpRoutePlugin\u003e()\n\n    init {\n        // Wire engine broadcast to all active WebSocket clients\n        engine.eventBroadcaster = { jsonString -\u003e\n            broadcastWebSocket(jsonString)\n        }\n    }\n\n    fun registerPlugin(plugin: HttpRoutePlugin) {\n        plugins.add(plugin)\n    }\n\n    fun unregisterPlugin(plugin: HttpRoutePlugin) {\n        plugins.remove(plugin)\n    }\n\n    @Synchronized\n    fun start() {\n        if (isRunning) return\n        isRunning = true\n\n        try {\n            serverSocket = ServerSocket(port)\n            serverSocket?.reuseAddress = true\n\n            executor.execute {\n                while (isRunning && serverSocket != null && !serverSocket!!.isClosed) {\n                    try {\n                        val clientSocket = serverSocket!!.accept()\n                        executor.execute {\n                            handleClient(clientSocket)\n                        }\n                    } catch (_: Exception) {\n                        // socket closed on stop\n                    }\n                }\n            }\n        } catch (e: Exception) {\n            isRunning = false\n        }\n    }\n\n    @Synchronized\n    fun stop() {\n        if (!isRunning) return\n        isRunning = false\n        try {\n            plugins.forEach { (it as? MuckerServerPlugin)?.onServerStop() }\n            activeWebSockets.forEach { it.close() }\n            activeWebSockets.clear()\n            serverSocket?.close()\n            serverSocket = null\n        } catch (_: Exception) {}\n    }\n\n    private fun broadcastWebSocket(text: String) {\n        activeWebSockets.forEach { ws -\u003e\n            if (!ws.isClosed) {\n                ws.sendText(text)\n            }\n        }\n    }\n\n    private fun handleClient(socket: Socket) {\n        try {\n            val inReader = BufferedReader(InputStreamReader(socket.getInputStream(), StandardCharsets.UTF_8))\n            val initialLine = inReader.readLine() ?: return\n            val parts = initialLine.split(\" \")\n            if (parts.size \u003c 2) return\n\n            val method = parts[0].uppercase()\n            val uri = parts[1]\n\n            val headers = mutableMapOf\u003cString, String\u003e()\n            var line: String?\n            while (inReader.readLine().also { line = it } != null) {\n                if (line.isNullOrEmpty()) break\n                val colonIdx = line!!.indexOf(':')\n                if (colonIdx \u003e 0) {\n                    val key = line!!.substring(0, colonIdx).trim().lowercase()\n                    val value = line!!.substring(colonIdx + 1).trim()\n                    headers[key] = value\n                }\n            }\n\n            // Check WebSocket Upgrade\n            val isWsUpgrade = headers[\"upgrade\"]?.equals(\"websocket\", ignoreCase = true) == true\n            if (isWsUpgrade && uri.startsWith(\"/devtools/page\")) {\n                handleWebSocketHandshake(socket, headers)\n                return\n            }\n\n            val outStream = socket.getOutputStream()\n\n            // Handle CORS Preflight\n            if (method == \"OPTIONS\") {\n                sendCorsPreflight(outStream)\n                socket.close()\n                return\n            }\n\n            // Read request body if present\n            var body = \"\"\n            val contentLength = headers[\"content-length\"]?.toIntOrNull() ?: 0\n            if (contentLength \u003e 0) {\n                val charBuf = CharArray(contentLength)\n                var readTotal = 0\n                while (readTotal \u003c contentLength) {\n                    val r = inReader.read(charBuf, readTotal, contentLength - readTotal)\n                    if (r == -1) break\n                    readTotal += r\n                }\n                body = String(charBuf, 0, readTotal)\n            }\n\n            val cleanPath = uri.split(\"?\")[0].trimEnd('/')\n\n            // Dispatch to registered plugins (e.g. :mucker-mcp)\n            for (plugin in plugins) {\n                if (plugin.handle(method, uri, cleanPath, headers, body, socket, outStream)) {\n                    return\n                }\n            }\n\n            // Serve Dashboard Web Assets\n            if (method == \"GET\" && (cleanPath == \"\" || cleanPath == \"/index.html\")) {\n                serveDashboardAsset(outStream)\n                socket.close()\n                return\n            }\n\n            // Route to REST Handler\n            val response = restHandler.handle(method, uri, body)\n            sendHttpResponse(outStream, response.statusCode, response.contentType, response.body)\n            socket.close()\n\n        } catch (_: Exception) {\n            try { socket.close() } catch (_: Exception) {}\n        }\n    }\n\n    private fun handleWebSocketHandshake(socket: Socket, headers: Map\u003cString, String\u003e) {\n        val key = headers[\"sec-websocket-key\"] ?: return\n        val acceptKey = computeWebSocketAccept(key)\n\n        val out = socket.getOutputStream()\n        val response = \"HTTP/1.1 101 Switching Protocols\\r\\n\" +\n                \"Upgrade: websocket\\r\\n\" +\n                \"Connection: Upgrade\\r\\n\" +\n                \"Sec-WebSocket-Accept: $acceptKey\\r\\n\\r\\n\"\n\n        out.write(response.toByteArray(StandardCharsets.UTF_8))\n        out.flush()\n\n        val ws = WebSocketConnection(\n            socket = socket,\n            onMessage = { msg, connection -\u003e\n                cdpHandler.handleMessage(msg, connection)\n            },\n            onClose = { connection -\u003e\n                activeWebSockets.remove(connection)\n            }\n        )\n\n        activeWebSockets.add(ws)\n        ws.startListening()\n    }\n\n    private fun computeWebSocketAccept(key: String): String {\n        val magic = key + \"258EAFA5-E914-47DA-95CA-C5AB0DC85B11\"\n        val md = MessageDigest.getInstance(\"SHA-1\")\n        val hash = md.digest(magic.toByteArray(StandardCharsets.UTF_8))\n        return java.util.Base64.getEncoder().encodeToString(hash)\n    }\n\n    private fun serveDashboardAsset(out: OutputStream) {\n        try {\n            var html = \"\"\n            if (context != null) {\n                try {\n                    context.assets.open(\"mucker-web/index.html\").use { input -\u003e\n                        html = input.bufferedReader(StandardCharsets.UTF_8).readText()\n                    }\n                } catch (_: Exception) {}\n            }\n\n            if (html.isEmpty()) {\n                html = \"\u003chtml\u003e\u003cbody\u003e\u003ch2\u003eMucker Engine Running\u003c/h2\u003e\u003cp\u003eDashboard asset not found in bundle.\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e\"\n            }\n\n            sendHttpResponse(out, 200, \"text/html; charset=utf-8\", html)\n        } catch (_: Exception) {\n            sendHttpResponse(out, 500, \"text/plain\", \"Failed to load dashboard\")\n        }\n    }\n\n    fun sendResponse(out: OutputStream, statusCode: Int, contentType: String, body: String) {\n        sendHttpResponse(out, statusCode, contentType, body)\n    }\n\n    fun sendPreflight(out: OutputStream) {\n        sendCorsPreflight(out)\n    }\n\n    private fun sendHttpResponse(out: OutputStream, statusCode: Int, contentType: String, body: String) {\n        val bodyBytes = body.toByteArray(StandardCharsets.UTF_8)\n        val statusText = when (statusCode) {\n            200 -\u003e \"OK\"\n            202 -\u003e \"Accepted\"\n            204 -\u003e \"No Content\"\n            400 -\u003e \"Bad Request\"\n            404 -\u003e \"Not Found\"\n            500 -\u003e \"Internal Server Error\"\n            else -\u003e \"OK\"\n        }\n        val header = \"HTTP/1.1 $statusCode $statusText\\r\\n\" +\n                \"Content-Type: $contentType\\r\\n\" +\n                \"Content-Length: ${bodyBytes.size}\\r\\n\" +\n                \"Access-Control-Allow-Origin: *\\r\\n\" +\n                \"Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS\\r\\n\" +\n                \"Access-Control-Allow-Headers: *\\r\\n\" +\n                \"Connection: close\\r\\n\\r\\n\"\n\n        out.write(header.toByteArray(StandardCharsets.UTF_8))\n        out.write(bodyBytes)\n        out.flush()\n    }\n\n    private fun sendCorsPreflight(out: OutputStream) {\n        val header = \"HTTP/1.1 204 No Content\\r\\n\" +\n                \"Access-Control-Allow-Origin: *\\r\\n\" +\n                \"Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS\\r\\n\" +\n                \"Access-Control-Allow-Headers: *\\r\\n\" +\n                \"Access-Control-Max-Age: 86400\\r\\n\" +\n                \"Content-Length: 0\\r\\n\" +\n                \"Connection: close\\r\\n\\r\\n\"\n        out.write(header.toByteArray(StandardCharsets.UTF_8))\n        out.flush()\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/mucker/MuckerInterceptor.kt":{"path":"mucker-interceptor/src/main/java/io/github/mucker/MuckerInterceptor.kt","lines":{"total":134,"covered":110,"skipped":24,"pct":82.09},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"22":{"hits":1},"23":{"hits":1},"24" url,\n            method = method,\n            headers = requestHeaders,\n            postData = postData\n        )\n        engine.history.record(record)\n\n        // Broadcast CDP Network.requestWillBeSent\n        engine.broadcast(CdpMessages.createNetworkRequestWillBeSent(requestId, url, method, requestHeaders))\n\n        // 1. Check static mock rules\n        val matchedRule = engine.rules.findMatchingRule(method, url)\n        if (matchedRule != null && matchedRule.isEnabled) {\n            if (matchedRule.delayMs \u003e 0) {\n                try {\n                    Thread.sleep(matchedRule.delayMs)\n                } catch (_: InterruptedException) {}\n            }\n\n            val mockResponse = buildMockResponse(\n                chain = chain,\n                statusCode = matchedRule.statusCode,\n                headers = matchedRule.responseHeaders,\n                body = matchedRule.responseBody,\n                mockTag = \"Mucker-Rule\"\n            )\n\n            record.statusCode = matchedRule.statusCode\n            record.responseHeaders = matchedRule.responseHeaders\n            record.responseBody = matchedRule.responseBody\n            record.responseTime = matchedRule.delayMs\n            record.isMocked = true\n\n            engine.broadcast(\n                CdpMessages.createNetworkResponseReceived(\n                    requestId = requestId,\n                    url = url,\n                    status = matchedRule.statusCode,\n                    headers = matchedRule.responseHeaders,\n                    body = matchedRule.responseBody,\n                    responseTime = matchedRule.delayMs\n                )\n            )\n\n            return mockResponse\n        }\n\n        // 2. Check Breakpoint Mode\n        if (engine.shouldIntercept(url)) {\n            val future = engine.pauseRequest(record)\n            val decision = try {\n                future.get(timeoutSeconds, TimeUnit.SECONDS)\n            } catch (e: TimeoutException) {\n                // Safe timeout fallback so app never hangs\n                MockDecision.Continue\n            } catch (e: Exception) {\n                MockDecision.Continue\n            }\n\n            when (decision) {\n                is MockDecision.Fulfill -\u003e {\n                    val mockResponse = buildMockResponse(\n                        chain = chain,\n                        statusCode = decision.statusCode,\n                        headers = decision.headers,\n                        body = decision.body,\n                        mockTag = \"Mucker-Breakpoint\"\n                    )\n\n                    record.isPaused = false\n                    record.isMocked = true\n                    record.statusCode = decision.statusCode\n                    record.responseHeaders = decision.headers\n                    record.responseBody = decision.body\n                    record.responseTime = 0\n\n                    engine.broadcast(\n                        CdpMessages.createNetworkResponseReceived(\n                            requestId = requestId,\n                            url = url,\n                            status = decision.statusCode,\n                            headers = decision.headers,\n                            body = decision.body\n                        )\n                    )\n\n                    return mockResponse\n                }\n                is MockDecision.Fail -\u003e {\n                    record.isPaused = false\n                    record.error = decision.errorReason\n                    throw IOException(\"Blocked by Mucker Breakpoint: ${decision.errorReason}\")\n                }\n                is MockDecision.Continue -\u003e {\n                    record.isPaused = false\n                    // Fallthrough to chain.proceed below\n                }\n            }\n        }\n\n        // 3. Normal real network execution\n        val startNs = System.nanoTime()\n        val res      val ctx = appContext\n        if (server == null) {\n            val s = MuckerHttpServer(port = port, engine = engine, context = ctx)\n            server = s\n            triggerMcpInit(s)\n        }\n        server?.start()\n    }\n\n    @Synchronized\n    fun stop() {\n        server?.stop()\n        server = null\n        appContext?.let { triggerNotificationHide(it) }\n    }\n\n    private fun triggerMcpInit(server: MuckerHttpServer) {\n        try {\n            val clazz = Class.forName(\"io.github.mucker.mcp.MuckerMcp\")\n            val method = clazz.getMethod(\"install\", MuckerHttpServer::class.java, MockEngine::class.java, Context::class.java)\n            method.invoke(null, server, engine, appContext)\n        } catch (_: Throwable) {\n            // Headless / Core mode: MCP module not on classpath\n        }\n    }\n\n    private fun triggerNotificationShow(context: Context, url: String) {\n        try {\n            val clazz = Class.forName(\"io.github.mucker.ui.MuckerNotification\")\n            val method = clazz.getMethod(\"show\", Context::class.java, String::class.java)\n            method.invoke(null, context, url)\n        } catch (_: Throwable) {\n            // Headless mode: no notification UI available on classpath\n        }\n    }\n\n    private fun triggerNotificationHide(context: Context) {\n        try {\n            val clazz = Class.forName(\"io.github.mucker.ui.MuckerNotification\")\n            val method = clazz.getMethod(\"hide\", Context::class.java)\n            method.invoke(null, context)\n        } catch (_: Throwable) {\n            // Headless mode\n        }\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/mucker/core/MockEngine.kt":{"path":"mucker-interceptor/src/main/java/io/github/mucker/core/MockEngine.kt","lines":{"total":66,"covered":55,"skipped":11,"pct":83.33},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"13":{"h
