rue\n        interceptPatterns.clear()\n        interceptPatterns.addAll(patterns)\n    }\n\n    fun disableInterception() {\n        breakpointMode = false\n        interceptPatterns.clear()\n        // Resume any pending futures so thread is never leaked\n        pendingFutures.forEach { (_, future) -\u003e\n            future.complete(MockDecision.Continue)\n        }\n        pendingFutures.clear()\n    }\n\n    fun shouldIntercept(url: String): Boolean {\n        if (!breakpointMode) return false\n        if (interceptPatterns.isEmpty()) return true // default intercept all if pattern is empty\n\n        return interceptPatterns.any { pattern -\u003e\n            if (pattern == \"*\") true\n            else try {\n                val regexPattern = pattern.replace(\".\", \"\\\\.\").replace(\"*\", \".*\")\n                url.matches(Regex(regexPattern)) || url.contains(pattern)\n            } catch (_: Exception) {\n                url.contains(pattern)\n            }\n        }\n    }\n\n    /**\n     * Pauses the request thread and broadcasts Fetch.requestPaused to all connected CDP clients / web UI.\n     */\n    fun pauseRequest(record: NetworkRecord): CompletableFuture\u003cMockDecision\u003e {\n        val future = CompletableFuture\u003cMockDecision\u003e()\n        pendingFutures[record.id] = future\n        record.isPaused = true\n\n        // Broadcast CDP Fetch.requestPaused\n        val eventJson = CdpMessages.createFetchRequestPaused(\n            requestId = record.id,\n            url = record.url,\n            method = record.method,\n            headers = record.headers,\n            postData = record.postData\n        )\n        eventBroadcaster?.invoke(eventJson)\n\n        return future\n    }\n\n    fun fulfill(requestId: String, decision: MockDecision.Fulfill): Boolean {\n        val future = pendingFutures.remove(requestId) ?: return false\n        val rec = history.find(requestId)\n        if (rec != null) {\n            rec.isPaused = false\n            rec.isMocked = true\n            rec.statusCode = decision.statusCode\n            rec.responseHeaders = decision.headers\n            rec.responseBody = decision.body\n        }\n        future.complete(decision)\n        return true\n    }\n\n    fun continueRequest(requestId: String): Boolean {\n        val future = pendingFutures.remove(requestId) ?: return false\n        val rec = history.find(requestId)\n        if (rec != null) {\n            rec.isPaused = false\n        }\n        future.complete(MockDecision.Continue)\n        return true\n    }\n\n    fun failRequest(requestId: String, reason: String = \"Failed\"): Boolean {\n        val future = pendingFutures.remove(requestId) ?: return false\n        val rec = history.find(requestId)\n        if (rec != null) {\n            rec.isPaused = false\n            rec.error = reason\n        }\n        future.complete(MockDecision.Fail(reason))\n        return true\n    }\n\n    fun getPendingPausedCount(): Int = pendingFutures.size\n\n    fun broadcast(json: String) {\n        eventBroadcaster?.invoke(json)\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/mucker/core/RequestHistory.kt":{"path":"mucker-interceptor/src/main/java/io/github/mucker/core/RequestHistory.kt","lines":{"total":14,"covered":8,"skipped":6,"pct":57.14},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"10":{"hits":1},"12":{"hits":1},"15":{"hits":1},"16":{"hits":1},"17":{"hits":0},"19":{"hits":1},"22":{"hits":1},"26":{"hits":1},"30":{"hits":0},"31":{"hits":0},"34":{"hits":0},"35":{"hits":0},"36":{"hits":0},"38":{"hits":1}},"sourceCode":"package io.github.mucker.core\n\nimport io.github.mucker.core.models.NetworkRecord\nimport org.json.JSONArray\nimport java.util.concurrent.CopyOnWriteArrayList\n\n/**\n * Thread-safe ring buffer storing recent network inspections.\n */\nclass RequestHistory(private val maxSize: Int = 200) {\n\n    private val records = CopyOnWriteArrayList\u003cNetworkRecord\u003e()\n\n    fun record(record: NetworkRecord) {\n        records.add(0, record)\n        while (records.size \u003e maxSize) {\n            records.removeAt(records.lastIndex)\n        }\n    }\n\n    fun find(id: String): NetworkRecord? {\n        return records.firstOrNull { it.id == id }\n    }\n\n    fun getAll(): List\u003cNetworkRecord\u003e {\n        return records.toList()\n    }\n\n    fun clear() {\n        records.clear()\n    }\n\n    fun toJson(): JSONArray {\n        val array = JSONArray()\n        records.forEach { array.put(it.toJson()) }\n        return array\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/mucker/core/MockRuleRegistry.kt":{"path":"mucker-interceptor/src/main/java/io/github/mucker/core/MockRuleRegistry.kt","lines":{"total":23,"covered":22,"skipped":1,"pct":95.65},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"10":{"hits":1},"12":{"hits":1},"16":{"hits":1},"17":{"hits":1},"18":{"hits":0},"20":{"hits":1},"22":{"hits":1},"26":{"hits":1},"30":{"hits":1},"31":{"hits":1},"34":{"hits":1},"35":{"hits":1},"36":{"hits":1},"40":{"hits":1},"44":{"hits":1},"48":{"hits":1},"49":{"hits":1},"50":{"hits":1},"54":{"hits":1},"55":{"hits":1},"56":{"hits":1},"57":{"hits":1},"59":{"hits":1}},"sourceCode":"package io.github.mucker.core\n\nimport io.github.mucker.core.models.MockRule\nimport org.json.JSONArray\nimport java.util.concurrent.CopyOnWriteArrayList\n\n/**\n * Thread-safe registry for configured mock rules.\n */\nclass MockRuleRegistry {\n\n    private val rules = CopyOnWriteArrayList\u003cMockRule\u003e()\n\n    fun addRule(rule: MockRule): MockRule {\n        // If rule with same ID exists, replace it\n        val existingIndex = rules.indexOfFirst { it.id == rule.id }\n        if (existingIndex \u003e= 0) {\n            rules[existingIndex] = rule\n        } else {\n            rules.add(rule)\n        }\n        return rule\n    }\n\n    fun removeRule(ruleId: String): Boolean {\n        return rules.removeIf { it.id == ruleId }\n    }\n\n    fun clearRules() {\n        rules.clear()\n    }\n\n    fun toggleRule(ruleId: String, isEnabled: Boolean): Boolean {\n        val rule = rules.firstOrNull { it.id == ruleId } ?: return false\n        rule.isEnabled = isEnabled\n        return true\n    }\n\n    fun findMatchingRule(method: String, url: String): MockRule? {\n        return rules.firstOrNull { it.matches(method, url) }\n    }\n\n    fun getAllRules(): List\u003cMockRule\u003e {\n        return rules.toList()\n    }\n\n    fun toJson(): JSONArray {\n        val array = JSONArray()\n        rules.forEach { array.put(it.toJson()) }\n        return array\n    }\n\n    fun loadFromJson(jsonArray: JSONArray) {\n        rules.clear()\n        for (i in 0 until jsonArray.length()) {\n            val obj = jsonArray.getJSONObject(i)\n            rules.add(MockRule.fromJson(obj))\n        }\n    }\n}\n"},"mucker-interceptor/src/main/java/io/github/mucker/util/NetworkUtils.kt":{"path":"mucker-interceptor/src/main/java/io/github/mucker/util/NetworkUtils.kt","lines":{"total":31,"covered":0,"skipped":31,"pct":0},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"15":{"hits":0},"16":{"hits":0},"17":{"hits":0},"18":{"hits":0},"19":{"hits":0},"20":{"hits":0},"22":{"hits":0},"23":{"hits":0},"24":{"hits":0},"25":{"hits":0},"26":{"hits":0},"27":{"hits":0},"28":{"hits":0},"33":{"hits":0},"35":{"hits":0},"39":{"hits":0},"40":{"hits":0},"41":{"hits":0},"42":{"hits":0},"43":{"hits":0},"44":{"hits":0},"45":{"hits":0},"46":{"hits":0},"47":{"hits":0},"53":{"hits":0},"54":{"hits":0},"55":{"hits":0},"56":{"hits":0},"57":{"hits":0},"58":{"hits":0},"59":{"hits":0}},"sourceCode":"package io.github.mucker.util\n\nimport android.content.Context\nimport android.net.wifi.WifiManager\nimport java.net.Inet4Address\nimport java.net.NetworkInterface\nimport java.nio.charset.StandardCharsets\nimport java.util.Base64\n\nobject NetworkUtils {\n\n    /**\n     * Resolves the primary local IPv4 address (e.g. Wi-Fi IP or hotspot IP).\n     */\n    fun getLocalIpAddress(context: Context? = null): String {\n        try {\n            val interfaces = NetworkInterface.getNetworkInterfaces()\n            while (interfaces.hasMoreElements()) {\n                val iface = interfaces.nextElement()\n                if (iface.isLoopback || !iface.isUp) continue\n\n                val addresses = iface.inetAddresses\n                while (addresses.hasMoreElements()) {\n                    val addr = addresses.nextElement()\n                    if (!addr.isLoopbackAddress && addr is Inet4Address) {\n                        val host = addr.hostAddress\n                        if (host != null && !host.startsWith(\"127.\")) {\n                            return host\n                        }\n                    }\n                }\n            }\n        } catch (_: Exception) {}\n\n        return \"127.0.0.1\"\n    }\n\n    fun decodeBase64(str: String): String {\n        return try {\n            val bytes = java.util.Base64.getDecoder().decode(str)\n            String(bytes, StandardCharsets.UTF_8)\n        } catch (_: Throwable) {\n            try {\n                val bytes = android.util.Base64.decode(str, android.util.Base64.DEFAULT)\n                String(bytes, StandardCharsets.UTF_8)\n            } catch (_: Throwable) {\n                str\n            }\n        }\n    }\n\n    fun encodeBase64(str: String): String {\n        return try {\n            java.util.Base64.getEncoder().encodeToString(str.toByteArray(StandardCharsets.UTF_8))\n        } catch (_: Throwable) {\n            try {\n                android.util.Base64.encodeToString(str.toByteArray(StandardCharsets.UTF_8), android.util.Base64.NO_WRAP)\n            } catch (_: Throwable) {\n                str 1},"357":{"hits":1},"358":{"hits":1},"359":{"hits":1},"360":{"hits":1},"364":{"hits":1},"365":{"hits":1},"366":{"hits":1},"368":{"hits":1},"369":{"hits":1},"370":{"hits":1},"371":{"hits":1},"372":{"hits":1}},"sourceCode":"package io.github.mucker.mcp\n\nimport android.content.Context\nimport io.github.mucker.core.MockEngine\nimport io.github.mucker.core.models.MockDecision\nimport io.github.mucker.core.models.MockRule\nimport org.json.JSONArray\nimport org.json.JSONObject\nimport java.util.UUID\n\n/**\n * Handles Model Context Protocol (MCP) JSON-RPC 2.0 messages over Streamable HTTP and SSE.\n * Allows AI assistants (Claude Code, Cursor, Windsurf, local LLMs) to directly control\n * the in-app OkHttp mock engine running on the Android device or emulator.\n */\nclass McpHandler(\n    private val engine: MockEngine,\n    private val port: Int,\n    private val context: Context?\n) {\n\n    /**\n     * Handles an incoming MCP JSON-RPC message and returns the JSON-RPC response.\n     */\n    fun handleMessage(rawMessage: String): String {\n        return try {\n            val trimmed = rawMessage.trim()\n            if (trimmed.isEmpty()) return createError(null, -32700, \"Empty payload\")\n            if (trimmed.startsWith(\"[\")) {\n                // Batch request\n                val array = JSONArray(trimmed)\n                val results = JSONArray()\n                for (i in 0 until array.length()) {\n                    val item = array.getJSONObject(i)\n                    val res = processSingleRequest(item)\n                    if (res != null) results.put(JSONObject(res))\n                }\n                results.toString()\n            } else {\n                val json = JSONObject(trimmed)\n                processSingleRequest(json) ?: \"\"\n            }\n        } catch (e: Exception) {\n            createError(null, -32700, \"Parse error: ${e.message}\")\n        }\n    }\n\n    private fun processSingleRequest(json: JSONObject): String? {\n        val id = if (json.has(\"id\")) json.get(\"id\") else null\n        val method = json.optString(\"method\", \"\")\n        val params = json.optJSONObject(\"params\") ?: JSONObject()\n\n        return when (method) {\n            \"initialize\" -\u003e handleInitialize(id, params)\n            \"notifications/initialized\" -\u003e {\n                // Client acknowledgement, no response required if notification (id == null)\n                if (id != null) createResult(id, JSONObject()) else null\n            }\n            \"ping\" -\u003e createResult(id, JSONObject())\n            \"tools/list\" -\u003e handleToolsList(id)\n            \"tools/call\" -\u003e handleToolsCall(id, params)\n            else -\u003e createError(id, -32601, \"Method not found: $method\")\n        }\n    }\n\n    @Suppress(\"UNUSED_PARAMETER\")\n    private fun handleInitialize(id: Any?, params: JSONObject): String {\n        val result = JSONObject()\n        result.put(\"protocolVersion\", \"2024-11-05\")\n\n        val capabilities = JSONObject()\n        val toolsCap = JSONObject()\n        toolsCap.put(\"listChanged\", false)\n        capabilities.put(\"tools\", toolsCap)\n        result.put(\"capabilities\", capabilities)\n\n        val serverInfo = JSONObject()\n        serverInfo.put(\"name\", \"mucker-android-interceptor\")\n        serverInfo.put(\"version\", \"1.0.0\")\n        result.put(\"serverInfo\", serverInfo)\n\n        return createResult(id, result)\n    }\n\n    private fun handleToolsList(id: Any?): String {\n        val toolsArray = JSONArray()\n\n        toolsArray.put(createToolDefinition(\n            name = \"get_status\",\n            description = \"Get live Mucker server status, active mock rules count, breakpoint mode state, and pending requests.\",\n            inputProperties = mapOf()\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"list_rules\",\n            description = \"List all registered mock rules currently active in Mucker memory.\",\n            inputProperties = mapOf()\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"add_rule\",\n            description = \"Add or update a dynamic mock rule with custom URL pattern, method, HTTP status code, delay, and response body.\",\n            inputProperties = mapOf(\n                \"urlPattern\" to mapOf(\"type\" to \"string\", \"description\" to \"Regex or substring URL pattern to match, e.g. .*/api/v1/user.*\"),\n                \"method\" to mapOf(\"type\" to \"string\", \"description\" to \"HTTP Method (GET, POST, PUT, DELETE, or ALL). Default: ALL\"),\n                \"statusCode\" to mapOf(\"type\" to \"integer\", \"description\" to \"HTTP Status code to return (e.g. 200, 404, 500). Default: 200\"),\n                \"delayMs\" to mapOf(\"type\" to \"integer\", \"description\" to \"Simulated network latency in milliseconds. Default: 0\"),\n                \"responseBody\" to mapOf(\"type\" to \"string\", \"description\" to \"JSON response body string. Default: {\\\"mocked\\\":true}\")\n            ),\n            required = listOf(\"urlPattern\")\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"remove_rule\",\n            description = \"Delete a mock rule by its unique ID from Mucker memory.\",\n            inputProperties = mapOf(\n                \"id\" to mapOf(\"type\" to \"string\", \"description\" to \"The rule ID to delete\")\n            ),\n            required = listOf(\"id\")\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"clear_rules\",\n            description = \"Clear all mock rules from Mucker engine memory.\",\n            inputProperties = mapOf()\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"toggle_rule\",\n            description = \"Enable or disable a mock rule without deleting it.\",\n            inputProperties = mapOf(\n                \"id\" to mapOf(\"type\" to \"string\", \"description\" to \"The rule ID to toggle\"),\n                \"isEnabled\" to mapOf(\"type\" to \"boolean\", \"description\" to \"true to enable, false to disable\")\n            ),\n            required = listOf(\"id\", \"isEnabled\")\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"set_breakpoint_mode\",\n            description = \"Toggle global breakpoint interception on or off. When enabled, matching requests pause in-flight.\",\n            inputProperties = mapOf(\n                \"breakpointMode\" to mapOf(\"type\" to \"boolean\", \"description\" to \"true to enable global request pausing, false to disable\")\n            ),\n            required = listOf(\"breakpointMode\")\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"list_history\",\n            description = \"Query recorded network request history with optional URL/body search filter.\",\n            inputProperties = mapOf(\n                \"query\" to mapOf(\"type\" to \"string\", \"description\" to \"Search keyword in request URL or response body\"),\n                \"method\" to mapOf(\"type\" to \"string\", \"description\" to \"Filter by HTTP method (GET, POST, etc.)\"),\n                \"limit\" to mapOf(\"type\" to \"integer\", \"description\" to \"Maximum number of records to return. Default: 20\")\n            )\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"fulfill_request\",\n            description = \"Fulfill an in-flight paused OkHttp request with a mocked status code, response headers, and response body.\",\n            inputProperties = mapOf(\n                \"requestId\" to mapOf(\"type\" to \"string\", \"description\" to \"The paused request ID (e.g. req_12345)\"),\n                \"statusCode\" to mapOf(\"type\" to \"integer\", \"description\" to \"HTTP status code. Default: 200\"),\n                \"responseBody\" to mapOf(\"type\" to \"string\", \"description\" to \"Mocked response body string\")\n            ),\n            required = listOf(\"requestId\")\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"continue_request\",\n            description = \"Resume a paused OkHttp request to hit the real network without modification.\",\n            inputProperties = mapOf(\n                \"requestId\" to mapOf(\"type\" to \"string\", \"description\" to \"The paused request ID to continue\")\n            ),\n            required = listOf(\"requestId\")\n        ))\n\n        toolsArray.put(createToolDefinition(\n            name = \"get_mock_rule_template\",\n            description = \"Generate a ready-to-run curl or REST API payload template for Mucker.\",\n            inputProperties = mapOf(\n                \"urlPattern\" to mapOf(\"type\" to \"string\", \"description\" to \"Target URL pattern\"),\n                \"statusCode\" to mapOf(\"type\" to \"integer\", \"description\" to \"Status code. Default: 200\"),\n                \"responseBody\" to mapOf(\"type\" to \"string\", \"description\" to \"Sample response body\")\n            ),\n            required = listOf(\"urlPattern\")\n        ))\n\n        val result = JSONObject()\n        result.put(\"tools\", toolsArray)\n        return createResult(id, result)\n    }\n\n    private fun handleToolsCall(id: Any?, params: JSONObject): String {\n        val name = params.optString(\"name\", \"\")\n        val args = params.optJSONObject(\"arguments\") ?: JSONObject()\n\n        return try {\n            val contentText = when (name) {\n                \"get_status\" -\u003e {\n                    val status = JSONObject()\n                    status.put(\"status\", \"running\")\n                    status.put(\"port\", port)\n                    status.put(\"app\", context?.packageName ?: \"Android App\")\n                    status.put(\"breakpointMode\", engine.breakpointMode)\n                    status.put(\"activeRulesCount\", engine.rules.getAllRules().size)\n                    status.put(\"pausedRequestsCount\", engine.getPendingPausedCount())\n                    status.put(\"totalHistoryCount\", engine.history.getAll().size)\n                    status.toString(2)\n                }\n\n                \"list_rules\" -\u003e {\n                    engine.rules.toJson().toString(2)\n                }\n\n                \"add_rule\" -\u003e {\n                    val urlPattern = args.getString(\"urlPattern\")\n                    val method = args.optString(\"method\", \"ALL\")\n                    val statusCode = args.optInt(\"statusCode\", 200)\n                    val delayMs = args.optLong(\"delayMs\", 0)\n                    val responseBody = args.optString(\"responseBody\", \"{\\\"mocked\\\":true}\")\n\n                    val rule = MockRule(\n                        id = UUID.randomUUID().toString().take(8),\n                        urlPattern = urlPattern,\n                        method = method,\n                        statusCode = statusCode,\n                        delayMs = delayMs,\n                        responseHeaders = mapOf(\"Content-Type\" to \"application/json\", \"X-Mocked-By\" to \"Mucker-InApp-MCP\"),\n                        responseBody = responseBody,\n                        isEnabled = true\n                    )\n                    engine.rules.addRule(rule)\n                    \"Successfully created mock rule:\\n${rule.toJson().toString(2)}\"\n                }\n\n                \"remove_rule\" -\u003e {\n                    val ruleId = args.getString(\"id\")\n                    val ok = engine.rules.removeRule(ruleId)\n                    if (ok) \"Successfully removed mock rule: $ruleId\" else \"Rule not found: $ruleId\"\n                }\n\n                \"clear_rules\" -\u003e {\n                    val count = engine.rules.getAllRules().size\n                    engine.rules.clearRules()\n                    \"Cleared all $count mock rules from Mucker engine memory.\"\n                }\n\n                \"toggle_rule\" -\u003e {\n                    val ruleId = args.getString(\"id\")\n                    val isEnabled = args.getBoolean(\"isEnabled\")\n                    val ok = engine.rules.toggleRule(ruleId, isEnabled)\n                    if (ok) \"Rule $ruleId is now ${if (isEnabled) \"ENABLED\" else \"DISABLED\"}\" else \"Rule not found: $ruleId\"\n                }\n\n                \"set_breakpoint_mode\" -\u003e {\n                    val mode = args.getBoolean(\"breakpointMode\")\n                    engine.breakpointMode = mode\n                    \"Breakpoint mode is now ${if (mode) \"ENABLED (all matching requests will pause)\" else \"DISABLED\"}.\"\n                }\n\n                \"list_history\" -\u003e {\n                    val query = args.optString(\"query\", \"\").lowercase()\n                    val method = args.optString(\"method\", \"\").uppercase()\n                    val limit = args.optInt(\"limit\", 20)\n\n                    val records = engine.history.getAll().filter { rec -\u003e\n                        (method.isEmpty() || rec.method.equals(method, ignoreCase = true)) &&\n                        (query.isEmpty() || rec.url.lowercase().contains(query) || (rec.responseBody?.lowercase()?.contains(query) == true))\n                    }.take(limit)\n\n                    val arr = JSONArray()\n                    for (rec in records) {\n                        arr.put(rec.toJson())\n                    }\n                    arr.toString(2)\n                }\n\n                \"fulfill_request\" -\u003e {\n                    val requestId = args.getString(\"requestId\")\n                    val statusCode = args.optInt(\"statusCode\", 200)\n                    val responseBody = args.optString(\"responseBody\", \"{\\\"status\\\":\\\"fulfilled_via_mcp\\\"}\")\n                    val headersMap = mapOf(\"Content-Type\" to \"application/json\", \"X-Mocked-By\" to \"Mucker-InApp-MCP\")\n\n                    val ok = engine.fulfill(requestId, MockDecision.Fulfill(statusCode, headersMap, responseBody))\n                    if (ok) \"Successfully fulfilled paused request $requestId with status $statusCode.\" else \"Failed to fulfill: request $requestId not found or timed out.\"\n                }\n\n                \"continue_request\" -\u003e {\n                    val requestId = args.getString(\"requestId\")\n                    val ok = engine.continueRequest(requestId)\n                    if (ok) \"Successfully resumed request $requestId to real network.\" else \"Failed: request $requestId not found or timed out.\"\n                }\n\n                \"get_mock_rule_template\" -\u003e {\n                    val urlPattern = args.getString(\"urlPattern\")\n                    val statusCode = args.optInt(\"statusCode\", 200)\n                    val body = args.optString(\"responseBody\", \"{\\\"status\\\":\\\"mocked\\\"}\")\n                    val curl = \"curl -X POST http://localhost:$port/api/rules -H \\\"Content-Type: application/json\\\" -d '{\\\"urlPattern\\\":\\\"$urlPattern\\\",\\\"statusCode\\\":$statusCode,\\\"responseBody\\\":${JSONObject.quote(body)}}'\"\n                    \"Mock Rule Template for $urlPattern (HTTP $statusCode):\\n\\n$curl\"\n                }\n\n                else -\u003e throw IllegalArgumentException(\"Unknown tool: $name\")\n            }\n\n            createToolCallResult(id, contentText, isError = false)\n        } catch (e: Exception) {\n            createToolCallResult(id, \"Error executing $name: ${e.message}\", isError = true)\n        }\n    }\n\n    private fun createToolDefinition(\n        name: String,\n        description: String,\n        inputProperties: Map\u003cString, Map\u003cString, String\u003e\u003e,\n        required: List\u003cString\u003e = emptyList()\n    ): JSONObject {\n        val tool = JSONObject()\n        tool.put(\"name\", name)\n        tool.put(\"description\", description)\n\n        val schema = JSONObject()\n        schema.put(\"type\", \"object\")\n\n        val props = JSONObject()\n        inputProperties.forEach { (key, meta) -\u003e\n            val p = JSONObject()\n            meta.forEach { (mk, mv) -\u003e p.put(mk, mv) }\n            props.put(key, p)\n        }\n        schema.put(\"properties\", props)\n\n        if (required.isNotEmpty()) {\n            val reqArray = JSONArray()\n            required.forEach { reqArray.put(it) }\n            schema.put(\"required\", reqArray)\n        }\n\n        tool.put(\"inputSchema\", schema)\n        return tool\n    }\n\n    private fun createToolCallResult(id: Any?, text: String, isError: Boolean): String {\n        val result = JSONObject()\n        val contentArray = JSONArray()\n        val contentItem = JSONObject()\n        contentItem.put(\"type\", \"text\")\n        contentItem.put(\"text\", text)\n        contentArray.put(contentItem)\n\n        result.put(\"content\", contentArray)\n        result.put(\"isError\", isError)\n        return createResult(id, result)\n    }\n\n    private fun createResult(id: Any?, result: JSONObject): String {\n        val root = JSONObject()\n        root.put(\"jsonrpc\", \"2.0\")\n        if (id != null) root.put(\"id\", id) else root.put(\"id\", JSONObject.NULL)\n        root.put(\"result\", result)\n        return root.toString()\n    }\n\n    private fun createError(id: Any?, code: Int, message: String): String {\n        val root = JSONObject()\n        root.put(\"jsonrpc\", \"2.0\")\n        if (id != null) root.put(\"id\", id) else root.put(\"id\", JSONObject.NULL)\n\n        val err = JSONObject()\n        err.put(\"code\", code)\n        err.put(\"message\", message)\n        root.put(\"error\", err)\n        return root.toString()\n    }\n}\n"},"mucker-mcp/src/main/java/io/github/mucker/mcp/MuckerMcpPlugin.kt":{"path":"mucker-mcp/src/main/java/io/github/mucker/mcp/MuckerMcpPlugin.kt","li 208":{"hits":1},"209":{"hits":1},"212":{"hits":1},"213":{"hits":1},"214":{"hits":1},"215":{"hits":1},"216":{"hits":1},"217":{"hits":1},"218":{"hits":1},"219":{"hits":1},"220":{"hits":1}},"sourceCode":"package io.github.mucker.mcp\n\nimport android.content.Context\nimport io.github.mucker.core.MockEngine\nimport io.github.mucker.server.MuckerHttpServer\nimport io.github.mucker.server.MuckerServerPlugin\nimport kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport kotlinx.coroutines.channels.Channel\nimport kotlinx.coroutines.launch\nimport org.json.JSONArray\nimport org.json.JSONObject\nimport java.io.OutputStream\nimport java.net.Socket\nimport java.nio.charset.StandardCharsets\nimport java.util.UUID\nimport java.util.concurrent.ConcurrentHashMap\n\n/**\n * Idiomatic, Coroutines-powered Model Context Protocol (MCP) server plugin for Mucker.\n * Handles Streamable HTTP (POST /mcp) and Server-Sent Events (GET /sse, POST /message).\n */\nclass MuckerMcpPlugin(\n    private val engine: MockEngine,\n    private val port: Int,\n    private val context: Context?,\n    private val scope: CoroutineScope = CoroutineScope(Dispatchers.IO + SupervisorJob())\n) : MuckerServerPlugin {\n\n    val handler = McpHandler(engine, port, context)\n\n    private class SseSession(\n        val sessionId: String,\n        val socket: Socket,\n        val channel: Channel\u003cString\u003e,\n        val job: Job\n    )\n\n    private val activeSessions = ConcurrentHashMap\u003cString, SseSession\u003e()\n\n    override fun handle(\n        method: String,\n        uri: String,\n        cleanPath: String,\n        headers: Map\u003cString, String\u003e,\n        body: String,\n        socket: Socket,\n        outStream: OutputStream\n    ): Boolean {\n        return when {\n            // Streamable HTTP: POST /mcp or POST /api/mcp\n            (cleanPath == \"/mcp\" || cleanPath == \"/api/mcp\") && method == \"POST\" -\u003e {\n                val response = handler.handleMessage(body)\n                sendHttpResponse(outStream, 200, \"application/json; charset=utf-8\", response)\n                socket.close()\n                true\n            }\n\n            // Discovery: GET /mcp or GET /api/mcp\n            (cleanPath == \"/mcp\" || cleanPath == \"/api/mcp\") && method == \"GET\" -\u003e {\n                val discovery = JSONObject().apply {\n                    put(\"service\", \"mucker-mcp-server\")\n                    put(\"version\", \"1.0.0\")\n                    put(\"transports\", JSONArray(listOf(\"streamable-http\", \"sse\")))\n                    put(\"endpoints\", JSONObject().apply {\n                        put(\"http\", \"/mcp\")\n                        put(\"sse\", \"/sse\")\n                        put(\"message\", \"/message\")\n                    })\n                }\n                sendHttpResponse(outStream, 200, \"application/json; charset=utf-8\", discovery.toString(2))\n                socket.close()\n                true\n            }\n\n            // SSE Stream: GET /sse or GET /mcp/sse\n            (cleanPath == \"/sse\" || cleanPath == \"/mcp/sse\") && method == \"GET\" -\u003e {\n                handleSseConnect(socket, outStream)\n                true\n            }\n\n            // SSE Client Message: POST /message or POST /messages\n            (cleanPath == \"/message\" || cleanPath == \"/messages\") && method == \"POST\" -\u003e {\n                handleSsePostMessage(uri, body, socket, outStream)\n                true\n            }\n\n            else -\u003e false\n        }\n    }\n\n    private fun handleSseConnect(socket: Socket, outStream: OutputStream) {\n        val sessionId = UUID.randomUUID().toString()\n        val eventChannel = Channel\u003cString\u003e(Channel.BUFFERED)\n\n        val job = scope.launch {\n            try {\n                // 1. Initial SSE Header\n                val header = \"HTTP/1.1 200 OK\\r\\n\" +\n                        \"Content-Type: text/event-stream\\r\\n\" +\n                        \"Cache-Control: no-cache\\r\\n\" +\n                        \"Connection: keep-alive\\r\\n\" +\n                        \"Access-Control-Allow-Origin: *\\r\\n\" +\n                        \"Access-Control-Allow-Headers: *\\r\\n\\r\\n\"\n                outStream.write(header.toByteArray(StandardCharsets.UTF_8))\n                outStream.flush()\n\n                // 2. Announce message POST endpoint with sessionId per MCP SSE spec\n                val endpointEvent = \"event: endpoint\\r\\ndata: /message?sessionId=$sessionId\\r\\n\\r\\n\"\n                outStream.write(endpointEvent.toByteArray(StandardCharsets.UTF_8))\n                outStream.flush()\n\n                // 3. Consume channel events and push over SSE\n                for (msg in eventChannel) {\n                    if (socket.isClosed) break\n                    val event = \"event: message\\r\\ndata: $msg\\r\\n\\r\\n\"\n                    outStream.write(event.toByteArray(StandardCharsets.UTF_8))\n                    outStream.flush()\n                }\n            } catch (_: Exception) {\n            } finally {\n                activeSessions.remove(sessionId)\n                eventChannel.close()\n                try { socket.close() } catch (_: Exception) {}\n            }\n        }\n\n        val session = SseSession(sessionId, socket, eventChannel, job)\n        activeSessions[sessionId] = session\n\n        // Monitor client disconnect in background\n        scope.launch {\n            try {\n                val inStream = socket.getInputStream()\n                val buf = ByteArray(128)\n                while (!socket.isClosed) {\n                    val r = inStream.read(buf)\n                    if (r == -1) break\n                }\n            } catch (_: Exception) {\n            } finally {\n                session.job.cancel()\n                session.channel.close()\n                activeSessions.remove(sessionId)\n                try { socket.close() } catch (_: Exception) {}\n            }\n        }\n    }\n\n    private fun handleSsePostMessage(uri: String, body: String, socket: Socket, outStream: OutputStream) {\n        val sessionId = parseQueryParam(uri, \"sessionId\")\n        val session = sessionId?.let { activeSessions[it] }\n\n        val result = handler.handleMessage(body)\n\n        if (session != null && !session.socket.isClosed) {\n            if (result.isNotEmpty()) {\n                session.channel.trySend(result)\n            }\n            sendHttpResponse(outStream, 202, \"text/plain; charset=utf-8\", \"Accepted\")\n        } else {\n            if (result.isNotEmpty()) {\n                sendHttpResponse(outStream, 200, \"application/json; charset=utf-8\", result)\n            } else {\n                sendHttpResponse(outStream, 204, \"text/plain\", \"\")\n            }\n        }\n        socket.close()\n    }\n\n    private fun parseQueryParam(uri: String, key: String): String? {\n        val qIdx = uri.indexOf('?')\n        if (qIdx == -1 || qIdx \u003e= uri.length - 1) return null\n        val query = uri.substring(qIdx + 1)\n        for (pair in query.split(\"&\")) {\n            val parts = pair.split(\"=\", limit = 2)\n            if (parts[0] == key) {\n                return if (parts.size \u003e 1) parts[1] else \"\"\n            }\n        }\n        return null\n    }\n\n    private fun sendHttpResponse(out: OutputStream, statusCode: Int, contentType: String, body: String) {\n        val bodyBytes = body.toByteArray(StandardCharsets.UTF_8)\n        val statusText = when (statusCode) {\n            200 -\u003e \"OK\"\n            202 -\u003e \"Accepted\"\n            204 -\u003e \"No Content\"\n            400 -\u003e \"Bad Request\"\n            404 -\u003e \"Not Found\"\n            500 -\u003e \"Internal Server Error\"\n            else -\u003e \"OK\"\n        }\n        val header = \"HTTP/1.1 $statusCode $statusText\\r\\n\" +\n                \"Content-Type: $contentType\\r\\n\" +\n                \"Content-Length: ${bodyBytes.size}\\r\\n\" +\n                \"Access-Control-Allow-Origin: *\\r\\n\" +\n                \"Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS\\r\\n\" +\n                \"Access-Control-Allow-Headers: *\\r\\n\" +\n                \"Connection: close\\r\\n\\r\\n\"\n\n        out.write(header.toByteArray(StandardCharsets.UTF_8))\n        out.write(bodyBytes)\n        out.flush()\n    }\n\n    override fun onServerStop() {\n        activeSessions.values.forEach { session -\u003e\n            session.job.cancel()\n            session.channel.close()\n            try { session.socket.close() } catch (_: Exception) {}\n        }\n        activeSessions.clear()\n        scope.cancel()\n    }\n}\n"},"mucker-mcp/src/main/java/io/github/mucker/mcp/MuckerMcp.kt":{"path":"mucker-mcp/src/main/java/io/github/mucker/mcp/MuckerMcp.kt","lines":{"total":7,"covered":3,"skipped":4,"pct":42.86},"functions":{"total":0,"covered":0,"skipped":0,"pct":100},"branches":{"total":0,"covered":0,"skipped":0,"pct":100},"lineDetails":{"15":{"hits":1},"16":{"hits":1},"17":{"hits":1},"25":{"hits":0},"31":{"hits":0},"32":{"hits":0},"33":{"hits":0}},"sourceCode":"package io.github.mucker.mcp\n\nimport android.content.Context\nimport io.github.mucker.Mucker\nimport io.github.mucker.core.MockEngine\nimport io.github.mucker.server.MuckerHttpServer\n\n/**\n * Entry point to install Model Context Protocol (MCP) support into Mucker.\n */\nobject MuckerMcp {\n\n    @JvmStatic\n    fun install(server: MuckerHttpServer, engine: MockEngine, context: Context?): MuckerMcpPlugin {\n        val plugin = MuckerMcpPlugin(engine, server.port, context)\n        server.registerPlugin(plugin)\n        return plugin\n    }\n}\n\n/**\n * Kotlin extension function to enable MCP on a MuckerHttpServer instance.\n */\nfun MuckerHttpServer.enableMcp(engine: MockEngine, context: Context?): MuckerMcpPlugin {\n    return MuckerMcp.install(this, engine, context)\n}\n\n/**\n * Kotlin extension function to enable MCP on the Mucker singleton.\n */\nfun Mucker.enableMcp(context: Context? = null): MuckerMcpPlugin? {\n    val server = currentServer ?: return null\n    return MuckerMcp.install(server, engine, context)\n}\n"},"cli/bin/mucker.mjs":{"path":"cli/bin/mucker.mjs","lines":{"total":375,"covered":147,"skipped":228,"pct":39.2},"functions":{"total":12,"covered":4,"skipped":8,"pct":33.33},"branches":{"total":19,"covered":5,"skipped":14,"pct":26.32},"lineDetails":{"1":{"hits":3,"branches":{"total":1,"taken":1}},"2":{"hits":3},"3":{"hits":3},"4":{"hits":3},"5":{"hits":3},"6":{"hits":3},"7":{"hits":3},"8":{"hits":3},"9":{"hits":3},"10":{"hits":3},"11":{"hits":3},"12":{"hits":3},"13":{"hits":3},"14":{"hits":3},"15":{"hits":3},"16":{"hits":1,"branches":{"total":1,"taken":1}},"17":{"hits":1},"18":{"hits":1},"19":{"hits":1},"20":{"hits":1},"21":{"hits":1},"22":{"hits":1},"23":{"hits":1},"24":{"hits":1},"25":{"hits":1},"26":{"hits":3},"27":{"hits":1,"branches":{"total":1,"taken":1}},"28":{"hits":1},"29":{"hits":1},"30":{"hits":1},"31":{"hits":1},"32":{"hits":1},"33":{"hits":1},"34":{"hits":1},"35":{"hits":1},"36":{"hits":1},"37":{"hits":1},"38":{"hits":1},"39":{"hits":1},"40":{"hits":1},"41":{"hits":1},"42":{"hits":1},"43":{"hits":1},"44":{"hits":1},"45":{"hits":1},"46":{"hits":1},"47":{"hits":1},"48":{"hits":1},"49":{"hits":1},"50":{"hits":1},"51":{"hits":1},"52":{"hits":1},"53":{"hits":1},"54":{"hits":1},"55":{"hits":1},"56":{"hits":1},"57":{"hits":1},"58":{"hits":1},"59":{"hits":1},"60":{"hits":1},"61":{"hits":1},"62":{"hits":1},"63":{"hits":1},"64":{"hits":1},"65":{"hits":1},"66":{"hits":3},"67":{"hits":3,"branches":{"total":1,"taken":1}},"68":{"hits":3},"69":{"hits":3},"70":{"hits":3},"71":{"hits":3},"72":{"hits":3},"73":{"hits":3},"74":{"hits":3},"75":{"hits":3},"76":{"hits":3},"77":{"hits" nonymous_11","line":372,"hits":0}],"sourceCode":"#!/usr/bin/env node\n\nimport { c } from '../lib/colors.mjs';\nimport { findAdbPath, listDevices, forwardPort } from '../lib/adb.mjs';\nimport { MuckerClient } from '../lib/api.mjs';\nimport { listenLive } from '../lib/cdp.mjs';\nimport { exec, spawn } from 'node:child_process';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst __filename = fileURLToPath(import.meta.url);\nconst __dirname = path.dirname(__filename);\n\nconst VERSION = '1.0.0';\n\nfunction printBanner() {\n  console.log(`\n${c.cyan(c.bold('   __  _____  ______  ______  __ ___________ '))}\n${c.cyan(c.bold('  /  |/  / / / / __ \\\\/ ____/ / //_/ ____/ __ \\\\'))}\n${c.cyan(c.bold(' / /|_/ / / / / / / / /_    / ,\u003c / __/ / /_/ /'))}\n${c.cyan(c.bold('/ /  / / /_/ / /_/ / __/   / /| / /___/ _, _/ '))}\n${c.cyan(c.bold('/_/  /_/\\\\____/\\\\____/_/     /_/ |_/_____/_/ |_|  '))} ${c.dim(`v${VERSION}`)}\n  ${c.dim('Muck with your network, zero certs required. CDP-compatible Mock Engine.')}\n`);\n}\n\nfunction printHelp() {\n  printBanner();\n  console.log(`\n${c.bold('USAGE:')}\n  ${c.green('mucker')} \u003ccommand\u003e [options]\n\n${c.bold('COMMANDS:')}\n  ${c.yellow('demo')}                       One-line build, run demo app & launch browser dashboard\n  ${c.yellow('forward')} [port]               Forward adb port to connected device (default: 8080)\n  ${c.yellow('status')}                     Check Mucker status & connected app\n  ${c.yellow('open')}                       Open the Mucker Web Dashboard in your browser\n  ${c.yellow('listen')}                     Stream intercepted requests live to console\n  ${c.yellow('rules list')}                 List active mock rules\n  ${c.yellow('rules add')} \u003cpattern\u003e [opts] Add a mock rule\n  ${c.yellow('rules remove')} \u003cruleId\u003e      Remove a mock rule by ID\n  ${c.yellow('rules clear')}                Remove all mock rules\n  ${c.yellow('fulfill')} \u003creqId\u003e [opts]     Fulfill a paused request with mock response\n  ${c.yellow('continue')} \u003creqId\u003e           Continue a paused request without mocking\n  ${c.yellow('cdp')}                        Show CDP endpoints for Puppeteer/Playwright\n  ${c.yellow('devices')}                    List connected Android devices\n\n${c.bold('OPTIONS:')}\n  ${c.cyan('--host')} \u003curl\u003e                 Mucker server URL (default: http://localhost:8080)\n  ${c.cyan('--status')} \u003ccode\u003e              HTTP status code (default: 200)\n  ${c.cyan('--delay')} \u003cms\u003e                 Artificial delay in milliseconds (default: 0)\n  ${c.cyan('--method')} \u003cGET|POST|ALL\u003e     HTTP method to match (default: ALL)\n  ${c.cyan('--body')} \u003cstring|json\u003e         Mock response body string/JSON\n  ${c.cyan('--header')} \u003cKey:Value\u003e         Custom response header (repeatable)\n  ${c.cyan('-h, --help')}                   Show this help menu\n  ${c.cyan('-v, --version')}                Show version\n\n${c.bold('EXAMPLES:')}\n  $ mucker forward\n  $ mucker status\n  $ mucker rules add \"/api/v1/user\" --status 200 --body '{\"id\":1,\"name\":\"Alice\"}'\n  $ mucker rules add \"/api/v1/checkout\" --status 500 --delay 1000 --body '{\"error\":\"Failed\"}'\n  $ mucker listen\n`);\n}\n\nfunction parseArgs(args) {\n  const parsed = {\n    command: args[0],\n    subcommand: args[1],\n    positionals: [],\n    flags: {},\n  };\n\n  let i = 0;\n  while (i \u003c args.length) {\n    const arg = args[i];\n    if (arg.startsWith('--')) {\n      const key = arg.slice(2);\n      const next = args[i + 1];\n      if (next && !next.startsWith('-')) {\n        if (!parsed.flags[key]) {\n          parsed.flags[key] = next;\n        } else if (Array.isArray(parsed.flags[key])) {\n          parsed.flags[key].push(next);\n        } else {\n          parsed.flags[key] = [parsed.flags[key], next];\n        }\n        i += 2;\n        continue;\n      } else {\n
